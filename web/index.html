/* Rotating per-module colours, mirroring MODULE_COLORS in graphs.py */
const MODULE_COLORS = ["var(--accent)", "var(--data)", "var(--bole)",
                       "var(--good)", "var(--gold)", "var(--plum)"];

function lineChart(series, labels){
  const W = 320, H = 96, L = 26, R = 6, T = 8, B = 16;
  const n = Math.max(...series.map(s => s.points.length));
  if(n < 1) return "";
  const x = i => n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1);
  const y = v => T + (1 - v) * (H - T - B);
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(const g of [0, 0.5, 1]){
    out += `<line x1="${L}" y1="${y(g)}" x2="${W - R}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/>` +
           `<text x="${L - 5}" y="${y(g) + 3.5}" text-anchor="end" fill="var(--faint)" ` +
           `font-family="var(--mono)" font-size="9">${pct(g)}</text>`;
  }
  for(const s of series){
    let d = "", open = false;
    s.points.forEach((v, i) => {
      if(v === null || v === undefined){ open = false; return; }   // gap, as in _render_line_chart
      d += (open ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " ";
      open = true;
    });
    if(d && !s.noLine) out += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round"/>`;
    const dots = s.dots || [];
    s.points.forEach((v, i) => {
      if(v === null || v === undefined) return;
      const last = i === s.points.length - 1;
      if(!last && !s.markEvery && n > 14) return;
      // Dots shrink as rounds pile up, so every round fits the phone-width chart.
      const r = last ? 3.4 : n > 120 ? 1.1 : n > 60 ? 1.5 : n > 30 ? 1.9 : 2.4;
      out += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${r}"
               fill="${dots[i] || s.color}"/>`;
    });
  }
  if(labels){
    out += `<text x="${L}" y="${H - 3}" fill="var(--faint)" font-family="var(--mono)" font-size="9">${esc(labels[0])}</text>`;
    out += `<text x="${W - R}" y="${H - 3}" text-anchor="end" fill="var(--faint)" font-family="var(--mono)" font-size="9">${esc(labels[1])}</text>`;
  }
  return out + "</svg>";
}

/* render_session_accuracy(): this sitting's rounds, one colour per module. */
function sittingChart(){
  if(!view.sitting.length) return "";
  const mods = [];
  for(const s of view.sitting) if(!mods.includes(s.module)) mods.push(s.module);
  const colorOf = m => MODULE_COLORS[mods.indexOf(m) % MODULE_COLORS.length];
  const pts = view.sitting.map(s => s.total ? s.score / s.total : 0);
  const dots = view.sitting.map(s => colorOf(s.module));
  return `<div class="sheet chart">
    <h3>This sitting</h3>
    <p>${view.sitting.length} round${view.sitting.length === 1 ? "" : "s"} since you opened the app. Resets when you close it.</p>
    ${lineChart([{points:pts, color:"var(--line)", dots, markEvery:true}], ["first", "latest"])}
    <div class="legend">
      ${mods.map(m => `<span><b style="background:${colorOf(m)}"></b>${esc(m)}</span>`).join("")}
    </div>
  </div>`;
}

/* The label a round is filed under: a Mastery Check spans modules. */
function roundLabel(){ return view.mode === "check" ? CHECK : view.module; }

/* Per-round scores for this module, oldest to newest. */
function moduleRoundsChart(){
  const mod = roundLabel();
  const hist = stats.session_history.filter(s => s.module === mod);
  if(!hist.length) return "";
  const pts = hist.map(s => s.total ? s.score / s.total : 0);
  return `<div class="sheet chart">
    <h3>${esc(mod)} over time</h3>
    <p>What you scored in each of the last ${hist.length} round${hist.length === 1 ? "" : "s"} of
       ${view.mode === "check" ? "the check" : "this module"}, both directions.</p>
    ${lineChart([{points:pts, color:"var(--accent)"}], [`${hist.length} rounds ago`, "now"])}
  </div>`;
}

/* render_module_progress_over_time(): cumulative test accuracy against the
   mastery snapshot recorded with each session. Sessions logged before snapshots
   existed have no mastery value and leave a gap in the line. */
function cumulativeChart(){
  const mod = roundLabel();
  const hist = stats.session_history.filter(s => s.module === mod);
  if(!hist.length) return "";
  let cumCorrect = 0, cumTotal = 0;
  const acc = [], mast = [];
  for(const s of hist){
    cumCorrect += s.score;
    cumTotal += s.total;
    acc.push(cumTotal > 0 ? cumCorrect / cumTotal : 0);
    mast.push(s.mastery === null || s.mastery === undefined ? null : s.mastery);
  }
  const gaps = mast.some(m => m === null);
  return `<div class="sheet chart">
    <h3>Accuracy against mastery</h3>
    <p>Lifetime accuracy in ${esc(mod)} — every question ever asked — against
       ${view.mode === "check" ? "the mastery of everything the check draws from" : "the module's mastery"}
       at each round.${gaps ? " Gaps are rounds recorded before mastery was tracked." : ""}</p>
    ${lineChart([
      {points:acc, color:"var(--accent)"},
      {points:mast, color:"var(--gold)"}
    ], [`${hist.length} rounds ago`, "now"])}
    <div class="legend">
      <span><b style="background:var(--accent)"></b>Test accuracy — ${pct(acc[acc.length-1])}%</span>
      <span><b style="background:var(--gold)"></b>Mastery — ${pct(view.mode === "check"
        ? poolMastery(view.checkPool || []) : moduleMastery(view.module, view.words))}%</span>
    </div>
  </div>`;
}

/* render_module_ranking(): every module averaged over both directions, best
   first. Untested word/direction pairs count as 0, so a module can't exceed
   tested/total. Untouched modules are hidden to avoid a wall of zeroes, except
   the one just practised. */
function rankingChart(){
  // Keyed by the word's own module, so a Mastery Check shows a delta against
  // every module it happened to pull from.
  const quizzed = {}, touched = new Set();
  if(view.last) for(const r of view.last.results){
    const k = (r.module || view.module) + "|" + r.eng + "|" + r.tur;
    quizzed[k] = (quizzed[k] || 0) + 1;
    touched.add(r.module || view.module);
  }
  const ranked = [];
  for(const [mod, words] of allModules()){
    if(!words.length) continue;
    const live = touched.has(mod);
    let now = 0, old = 0;
    for(const [eng, tur] of words){
      const hEn = historyOf(mod, eng, tur, "en_to_tr");
      const hTr = historyOf(mod, eng, tur, "tr_to_en");
      const mEn = computeMastery(hEn), mTr = computeMastery(hTr);
      now += mEn + mTr;
      if(live){
        const k = quizzed[mod + "|" + eng + "|" + tur] || 0;
        old += view.dir === "en_to_tr"
          ? computeMastery(k ? hEn.slice(0, -k) : hEn) + mTr
          : mEn + computeMastery(k ? hTr.slice(0, -k) : hTr);
      }
    }
    const denom = words.length * 2;
    const mastery = now / denom;
    if(mastery === 0 && !live) continue;
    ranked.push({mod, mastery, n:words.length, live, delta: live ? mastery - old / denom : null});
  }
  if(!ranked.length) return "";
  ranked.sort((a, b) => b.mastery - a.mastery);

  return `<div class="sheet" style="overflow:hidden">
    <div class="chart" style="padding-bottom:4px">
      <h3>All modules ranked</h3>
      <p>Averaged over both directions. Words you've never been asked count as zero,
         so a module only fills up once you've covered all of it.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:1px;background:var(--line-soft)">
      ${ranked.map((r, i) => {
        const d = r.delta || 0;
        const dc = d > 0 ? "var(--good)" : d < 0 ? "var(--bad)" : "var(--faint)";
        const here = r.live;
        return `<div class="wordrow"${here ? ' style="background:var(--accent-wash)"' : ""}>
          <span class="tick" style="color:var(--faint);font-size:12px">${i + 1}</span>
          <span class="pair">
            <b${here ? ' style="color:var(--accent)"' : ""}>${esc(r.mod)}</b>
            <span>${r.n} words</span>
            ${deltaBar(r.mastery, d)}
          </span>
          <span class="delta">${pct(r.mastery)}%<br>
            <span style="color:${dc}">${r.delta === null ? "&nbsp;" : (d >= 0 ? "+" : "") + pct(d)}</span></span>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function renderResults(){
  const q = view.last;
  const n = q.questions.length;
  const say = q.score === n ? "Harika! Perfect round."
    : q.score >= n / 2 ? "Not bad — keep going."
    : "Keep at it, these will stick.";

  const check = view.mode === "check";
  const rows = q.results.map(r => {
    const mod = r.module || view.module;
    const hist = historyOf(mod, r.eng, r.tur, view.dir);
    const after = computeMastery(hist);
    const d = after - r.before;
    const dc = d > 0 ? "var(--good)" : d < 0 ? "var(--bad)" : "var(--faint)";
    const pair = view.dir === "en_to_tr"
      ? `<b>${esc(r.eng)}</b> <span>→</span> ${esc(r.tur)}`
      : `<b>${esc(r.tur)}</b> <span>→</span> ${esc(r.eng)}`;
    return `<div class="wordrow">
      <span class="tick" style="color:${r.correct ? "var(--good)" : "var(--bad)"}">${r.correct ? "✓" : "✕"}</span>
      <span class="pair">${pair}${check ? `<span class="from">${esc(mod)}</span>` : ""}${wordBars(hist, d)}</span>
      <span class="delta">${pct(after)}%<br>
        <span style="color:${dc}">${d >= 0 ? "+" : ""}${pct(d)}</span></span>
    </div>`;
  }).join("");

  app.innerHTML = `
    <div class="topbar"><div class="grow"><span class="eyebrow">${esc(roundLabel())} · ${view.dir === "en_to_tr" ? "EN → TR" : "TR → EN"}</span></div></div>
    <div class="sheet score">
      <span class="big num">${q.score}<small>/${n}</small></span>
      <span class="say">${say}</span>
    </div>

    <button class="primary" data-act="again">Same again — ${n} more</button>
    <div class="split">
      <button class="ghost" data-act="setup">Change direction or length</button>
      <button class="ghost" data-act="home">${check ? "Back to modules" : "Different module"}</button>
    </div>

    <div class="sheet" style="overflow:hidden">
      <div class="chart" style="padding-bottom:4px">
        <h3>This round</h3>
        <p>Segments are the last ten answers, widest = most recent.${
          check ? " Each answer counts as that word's newest result, so its module moves with it." : ""}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:1px;background:var(--line-soft)">${rows}</div>
    </div>

    ${sittingChart()}
    ${moduleRoundsChart()}
    ${weakWords()}
    ${cumulativeChart()}
    ${rankingChart()}

    <button class="ghost" data-act="progress">All progress over time →</button>`;
}

/* render_mastery_change(): every word in this module that's been tested in this
   direction, weakest first, with this round's gain or loss overlaid on the bar. */
function weakWords(){
  if(view.mode === "check") return "";   // a check spans modules; "this round" covers it
  const q = view.last;
  const quizzed = {};
  for(const r of q.results){
    const k = r.eng + "|" + r.tur;
    quizzed[k] = (quizzed[k] || 0) + 1;
  }

  const out = [];
  for(const w of Object.values(stats.words)){
    if(w.module !== view.module) continue;
    const h = (w[view.dir] && w[view.dir].history) || [];
    if(!h.length) continue;
    const m = computeMastery(h);
    const seen = quizzed[w.english + "|" + w.turkish] || 0;
    const delta = seen ? m - computeMastery(h.slice(0, -seen)) : null;
    out.push({m, delta, h, eng:w.english, tur:w.turkish, seen:w[view.dir].seen});
  }
  if(!out.length) return "";
  out.sort((a, b) => a.m - b.m || b.seen - a.seen);

  const rows = out.map(w => {
    const d = w.delta || 0;
    const dc = d > 0 ? "var(--good)" : d < 0 ? "var(--bad)" : "var(--faint)";
    return `<div class="wordrow">
      <span class="pair">
        <b>${esc(view.dir === "en_to_tr" ? w.eng : w.tur)}</b>
        <span>${esc(view.dir === "en_to_tr" ? w.tur : w.eng)}</span>
        ${wordBars(w.h, d)}
      </span>
      <span class="delta">${pct(w.m)}%<br>
        <span style="color:${dc}">${w.delta === null ? "&nbsp;" : (d >= 0 ? "+" : "") + pct(d)}</span></span>
    </div>`;
  }).join("");

  return `<div class="sheet" style="overflow:hidden">
    <div class="chart" style="padding-bottom:4px">
      <h3>Weakest words</h3>
      <p>Every ${view.dir === "en_to_tr" ? "English → Türkçe" : "Türkçe → English"} word
         you've been tested on here, weakest first. These come up most often.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:1px;background:var(--line-soft)">${rows}</div>
  </div>`;
}

/* Look up any word in the vocabulary and see where it stands. */
let SEARCH_INDEX = null;
function searchIndex(){
  if(SEARCH_INDEX) return SEARCH_INDEX;
  SEARCH_INDEX = [];
  for(const [mod, words] of allModules()){
    for(const [eng, tur] of words){
      SEARCH_INDEX.push({eng, tur, mod, key:fold(eng) + " " + fold(tur)});
    }
  }
  return SEARCH_INDEX;
}

function searchHits(query){
  const q = fold(query);
  if(!q) return [];
  const hits = searchIndex().filter(w => w.key.includes(q));
  // Whole-word and opening matches first, then alphabetical.
  hits.sort((a, b) => {
    const ra = fold(a.eng) === q || fold(a.tur) === q ? 0
             : fold(a.eng).startsWith(q) || fold(a.tur).startsWith(q) ? 1 : 2;
    const rb = fold(b.eng) === q || fold(b.tur) === q ? 0
             : fold(b.eng).startsWith(q) || fold(b.tur).startsWith(q) ? 1 : 2;
    return ra - rb || a.eng.localeCompare(b.eng);
  });
  return hits;
}

function searchResults(query){
  const hits = searchHits(query);
  if(!query.trim()) return `<p class="note" style="text-align:center">
    ${searchIndex().length} words. Type in either language — accents optional.</p>`;
  if(!hits.length) return `<p class="note" style="text-align:center">
    Nothing matches “${esc(query)}”.</p>
    <button class="ghost" data-act="wfromsearch">Add “${esc(query.trim())}” to My words</button>`;
  return `<div style="display:flex;flex-direction:column;gap:1px;background:var(--line-soft);
      border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden">
    ${hits.slice(0, 60).map(w => {
      const en = computeMastery(historyOf(w.mod, w.eng, w.tur, "en_to_tr"));
      const tr = computeMastery(historyOf(w.mod, w.eng, w.tur, "tr_to_en"));
      const col = v => v === 0 ? "var(--faint)" : v >= 0.9 ? "var(--good)" : "var(--ink)";
      return `<div class="hit">
        <span class="w">
          <b>${esc(w.eng)}</b> <span>${esc(w.tur)}</span>
          <span class="mod">${esc(w.mod)}</span>
        </span>
        <span class="dirs">
          <div style="color:${col(en)}">${pct(en)}%<small>EN→TR</small></div>
          <div style="color:${col(tr)}">${pct(tr)}%<small>TR→EN</small></div>
        </span>
      </div>`;
    }).join("")}
  </div>
  ${hits.length > 60 ? `<p class="note" style="text-align:center">
    Showing 60 of ${hits.length} matches.</p>` : ""}`;
}

function renderSearch(){
  app.innerHTML = `
    ${topbar("Look up a word", "home")}
    <input class="search" id="q" type="search" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="English or Türkçe…" value="${esc(view.query)}">
    <div id="hits">${searchResults(view.query)}</div>`;
  const box = document.getElementById("q");
  box.addEventListener("input", () => {
    view.query = box.value;
    // Patch just the list so the field keeps focus and the keyboard stays up.
    document.getElementById("hits").innerHTML = searchResults(view.query);
  });
  if(!view.query) box.focus();
}

/* One dot per round, coloured by group, over lifetime accuracy -- and, where
   the rounds carry mastery snapshots, the overall mastery at that point: the
   mean of each group's latest snapshot, with groups not yet practised at 0. */
function roundsOverview(hist, groups, nameOf, title, overallNow){
  if(!hist.length) return "";
  const shown = hist, skipped = 0;
  const colorOf = g => MODULE_COLORS[groups.indexOf(g) % MODULE_COLORS.length];
  const latest = {};
  hist.slice(0, skipped).forEach(r => { if(r.mastery != null) latest[r.module] = r.mastery; });
  let cc = hist.slice(0, skipped).reduce((n, r) => n + r.score, 0);
  let ct = hist.slice(0, skipped).reduce((n, r) => n + r.total, 0);
  const acc = [], dots = [], scores = [], overall = [];
  for(const r of shown){
    cc += r.score; ct += r.total;
    acc.push(ct ? cc / ct : 0);
    scores.push(r.total ? r.score / r.total : 0);
    dots.push(colorOf(r.module));
    if(r.mastery != null) latest[r.module] = r.mastery;
    overall.push(overallNow ? groups.reduce((t, g) => t + (latest[g] || 0), 0) / groups.length : null);
  }
  const used = groups.filter(g => shown.some(r => r.module === g));
  const series = [{points:scores, color:"var(--line)", dots, noLine:true, markEvery:true},
                  {points:acc, color:"var(--accent)"}];
  if(overallNow) series.push({points:overall, color:"var(--gold)"});
  return `<div class="sheet chart">
    <h3>${esc(title)}</h3>
    <p>Each dot is one round, coloured by ${overallNow ? "what you practised" : "module"}; the lines are lifetime
      accuracy${overallNow ? " and overall mastery" : ""}, across all ${hist.length} round${hist.length === 1 ? "" : "s"}.</p>
    ${lineChart(series, [`${shown.length} rounds ago`, "now"])}
    <div class="legend">
      <span><b style="background:var(--accent)"></b>Accuracy — ${pct(acc[acc.length - 1])}%</span>
      ${overallNow ? `<span><b style="background:var(--gold)"></b>Overall mastery — ${pct(overallNow())}%</span>` : ""}
      ${used.map(g => `<span><b style="background:${colorOf(g)};border-radius:50%"></b>${esc(nameOf(g))}</span>`).join("")}
    </div>
  </div>`;
}
const conjOverall = () => meanOf(Grammar.CATEGORIES.map(c => conjMastery(c.id)));
const syntaxOverall = () => meanOf(Grammar.LEVELS.map(l => levelMastery(l.id)));
const conjOverview = title => roundsOverview(stats.conjugation.session_history, Grammar.CATEGORIES.map(c => c.id),
  id => (Grammar.CATEGORY[id] || {name:id}).name, title, conjOverall);
const syntaxOverview = title => roundsOverview(stats.syntax.session_history, Grammar.LEVELS.map(l => l.id),
  id => (Grammar.LEVELS.find(l => l.id === id) || {name:id}).name, title, syntaxOverall);

/* Progress across everything in a mode, or narrowed to one vocab module, one
   conjugation or one sentence level. Filter values: "", "v:<module>",
   "c:*" / "c:<id>", "s:*" / "s:<level>". */
function renderProgress(){
  const f = view.filter, kind = f.slice(0, 2), key = f.slice(2);
  const mods = [...new Set(stats.session_history.map(s => s.module))].sort();
  const conjs = Grammar.CATEGORIES.filter(c => stats.conjugation.session_history.some(s => s.module === c.id));
  const levels = Grammar.LEVELS.filter(l => stats.syntax.session_history.some(s => s.module === l.id));

  let hist, name, now, extra, overview = null;
  if(kind === "c:" && key === "*"){
    hist = stats.conjugation.session_history; name = "All conjugations"; now = conjOverall();
    overview = conjOverview("Every conjugation");
    extra = conjRanking(null, null);
  }else if(kind === "c:" && Grammar.CATEGORY[key]){
    hist = stats.conjugation.session_history.filter(s => s.module === key);
    name = Grammar.CATEGORY[key].name;
    now = conjMastery(key);
    extra = gridSheet(key, null, "Every ending") + conjRanking(null, null);
  }else if(kind === "s:" && key === "*"){
    hist = stats.syntax.session_history; name = "All sentences"; now = syntaxOverall();
    overview = syntaxOverview("Every sentence level");
    extra = levelsSheet(null);
  }else if(kind === "s:" && Grammar.LEVELS.some(l => l.id === key)){
    hist = stats.syntax.session_history.filter(s => s.module === key);
    name = `${Grammar.LEVELS.find(l => l.id === key).name} sentences`;
    now = levelMastery(key);
    extra = levelsSheet(null);
  }else if(kind === "v:"){
    hist = stats.session_history.filter(s => s.module === key);
    name = key;
    now = moduleMastery(key, moduleWordsFor(key));
    extra = rankingChart();
  }else{
    hist = stats.session_history; name = "All vocabulary"; now = overallMastery();
    overview = roundsOverview(hist, mods, m => m, "Every vocabulary module", null);
    extra = rankingChart();
  }

  let body;
  if(!hist.length){
    body = `<div class="sheet chart"><h3>Nothing recorded yet</h3>
      <p>Finish a round and it shows up here.</p></div>`;
  }else{
    body = overview !== null ? overview
      : accuracyChart(hist, `Lifetime accuracy in ${esc(name)} against its mastery at each round.`, now);
    const questions = hist.reduce((n, s) => n + s.total, 0);
    const correct = hist.reduce((n, s) => n + s.score, 0);
    body += `
      <div class="sheet stack">
        <span class="eyebrow">${esc(name)}</span>
        <p class="note" style="margin:0">
          <b class="num">${hist.length}</b> rounds · <b class="num">${correct}/${questions}</b>
          questions right (<b class="num">${questions ? Math.round(correct / questions * 100) : 0}%</b>) ·
          mastery now <b class="num">${pct(now)}%</b>
        </p>
      </div>`;
  }

  const opt = (value, label) =>
    `<option value="${esc(value)}"${f === value ? " selected" : ""}>${esc(label)}</option>`;
  app.innerHTML = `
    ${topbar("Progress", "home")}
    <div class="field">
      <select id="filter">
        <optgroup label="Vocabulary">
          ${opt("", "All vocabulary")}
          ${mods.map(m => opt("v:" + m, m)).join("")}
        </optgroup>
        <optgroup label="Conjugation">
          ${opt("c:*", "All conjugations")}
          ${conjs.map(c => opt("c:" + c.id, c.name)).join("")}
        </optgroup>
        <optgroup label="Sentences">
          ${opt("s:*", "All sentences")}
          ${levels.map(l => opt("s:" + l.id, `${l.name} sentences`)).join("")}
        </optgroup>
      </select>
    </div>
    ${body}
    ${extra}`;

  const sel = document.getElementById("filter");
  if(sel) sel.addEventListener("change", e => { view.filter = e.target.value; render(); });
}

function moduleWordsFor(module){
  for(const [mod, words] of allModules()) if(mod === module) return words;
  return [];
}

function renderData(){
  const json = JSON.stringify(stats, null, 2);
  const words = Object.keys(stats.words).length;
  app.innerHTML = `

function importStats(mode){
  const raw = document.getElementById("paste").value.trim();
  if(!raw) return toast("Nothing to import");
  let incoming;
  try{ incoming = JSON.parse(raw); }
  catch(e){ return toast("That isn't valid JSON"); }
  if(!incoming || typeof incoming !== "object" || !incoming.words)
    return toast("No \"words\" key — is that a stats.json?");
  incoming = normalize(incoming);
  if(mode === "replace"){
    stats = incoming;
  }else{
    // Merge: append unseen history, keep the longer record per word/direction.
    for(const [key, w] of Object.entries(incoming.words)){
      const mine = stats.words[key];
      if(!mine){ stats.words[key] = w; continue; }
      for(const dir of DIRS){
        const a = (mine[dir].history || []), b = (w[dir].history || []);
        if(b.length > a.length){
          mine[dir].history = b;
          mine[dir].seen = Math.max(mine[dir].seen, w[dir].seen);
          mine[dir].correct = Math.max(mine[dir].correct, w[dir].correct);
        }
      }
    }
    for(const [m, d] of Object.entries(incoming.modules)){
      if(!stats.modules[m]) stats.modules[m] = d;
    }
    const seen = new Set(stats.session_history.map(s => s.timestamp));
    for(const s of incoming.session_history){
      if(!seen.has(s.timestamp)) stats.session_history.push(s);
    }
    stats.session_history.sort((a, b) => a.timestamp < b.timestamp ? -1 : 1);
    stats.sessions = stats.session_history.length;

    // Conjugation cells and sentence levels: keep whichever history is longer.
    for(const [k, c] of Object.entries(incoming.conjugation.cells)){
      const mine = stats.conjugation.cells[k];
      if(!mine || (c.history || []).length > (mine.history || []).length) stats.conjugation.cells[k] = c;
    }
    for(const [k, l] of Object.entries(incoming.syntax.levels)){
      const mine = stats.syntax.levels[k];
      if(!mine || (l.history || []).length > (mine.history || []).length) stats.syntax.levels[k] = l;
    }
    // My words: add any the other copy has that this one doesn't.
    for(const w of incoming.custom_words){
      if(!stats.custom_words.some(m => sameWord(m, w))) stats.custom_words.push(w);
    }
    for(const group of ["conjugation", "syntax"]){
      const list = stats[group].session_history;
      const have = new Set(list.map(s => s.timestamp));
      for(const s of incoming[group].session_history) if(!have.has(s.timestamp)) list.push(s);
      list.sort((a, b) => a.timestamp < b.timestamp ? -1 : 1);
    }
  }
  refreshVocab();
  saveStats();
  toast(mode === "replace" ? "Progress replaced" : "Progress merged");
  render();
}

/* ===========================================================================
   Conjugation mode -- a word and a person, six forms to pick from. Mastery is
   tracked per cell of person × harmony vowel rather than per word, so
   "possession, 3rd plural, ö/ü" is one thing to learn whichever word shows it.
   =========================================================================== */
/* My words are folded into VOCAB as one flat module, and the typed ones also
   join the conjugation and sentence pools. Rebuilt whenever the list changes. */
const MY = "My Words";
let CONJ_POOLS, SLOT_POOLS;
function customEntries(){
  return stats.custom_words.map(w => ({en:w.en, tr:w.tr, module:MY, type:w.type}));
}
function refreshVocab(){
  if(stats.custom_words.length) VOCAB[MY] = {Main: stats.custom_words.map(w => [w.en, w.tr])};
  else delete VOCAB[MY];
  CONJ_POOLS = Grammar.buildPools(VOCAB, customEntries());
  SLOT_POOLS = Grammar.buildSlotPools(VOCAB, customEntries());
  SEARCH_INDEX = null;
}
refreshVocab();
const {PERSONS, PRONOUN, PERSON_EN} = Grammar;
const plainEn = en => en.replace(/\s*\(.*?\)/g, "").trim();
const meanOf = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;
const verdictLine = (score, n) => score === n ? "Harika! Perfect round."
  : score >= n / 2 ? "Not bad — keep going." : "Keep at it, these will stick.";
const signed = d => (d >= 0 ? "+" : "") + pct(d);
const deltaColor = d => d > 0 ? "var(--good)" : d < 0 ? "var(--bad)" : "var(--faint)";

const cellKey = (id, p, v) => `${id}|${p}|${v}`;
/* Each stored answer counts twice when read, so a cell masters in half the
   answers a vocab word needs -- the cells are close cousins, and 4 correct in a
   row per cell made a category a slog. Storage stays one entry per answer. */
function cellHistory(id, p, v){
  const c = stats.conjugation.cells[cellKey(id, p, v)];
  return ((c && c.history) || []).flatMap(a => [a, a]);
}
/* Only vowels some word in the category ends in -- the rest can't be asked. */
function conjVowels(id){
  const have = new Set(CONJ_POOLS[id].map(e => e.vowel));
  return Grammar.VOWELS.filter(v => have.has(v));
}
/* Mean over every reachable cell; untested cells count as 0, as untested words do.
   `minus` ({cellKey: n}) drops each cell's last n answers, for the pre-round figure. */
function conjMastery(id, minus){
  const vs = conjVowels(id);
  if(!vs.length) return 0;
  let total = 0;
  for(const p of PERSONS) for(const v of vs){
    const h = cellHistory(id, p, v), k = (minus && minus[cellKey(id, p, v)]) || 0;
    total += computeMastery(k ? h.slice(0, -2 * k) : h);    // doubled history
  }
  return total / (vs.length * PERSONS.length);
}
function recordCell(id, p, v, correct){
  const key = cellKey(id, p, v);
  const c = stats.conjugation.cells[key] || (stats.conjugation.cells[key] = {seen:0, correct:0, history:[]});
  c.seen += 1;
  if(correct) c.correct += 1;
  c.history.push(correct);
}

/* WeightedRecommender over cells: weakest person × vowel first, never exhausted. */
function selectCells(id, n){
  const cells = [];
  for(const p of PERSONS) for(const v of conjVowels(id)){
    cells.push({p, v, w: Math.max(1 - computeMastery(cellHistory(id, p, v)), MIN_WEIGHT)});
  }
  const out = [];
  let pool = [];
  while(out.length < n && cells.length){
    if(!pool.length) pool = cells.slice();
    let r = Math.random() * pool.reduce((s, c) => s + c.w, 0), i = 0;
    for(; i < pool.length - 1; i++){ r -= pool[i].w; if(r <= 0) break; }
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}

const conjWord = (id, entry) => Grammar.CATEGORY[id].keepCase ? entry.tr : Grammar.lower(entry.tr);
/* The * on words that break this category's rule -- hidden for a harder round. */
const irregularMark = entry => entry.irregular && prefs.markIrregular
  ? `<sup class="irr" title="Irregular in this category">*</sup>` : "";
const conjBase = (id, entry) => {
  const w = Grammar.lower(entry.tr);
  return Grammar.CATEGORY[id].verb ? w.replace(/m[ae]k$/, "") : w;
};

/* How much of each button to drop: the stretch every choice shares with each
   other and with the dictionary word. What's left is the ending, plus any
   letter that changes -- kulak gives -ğım / -kım, gitmek gives -diyorum. */
function sharedStem(forms, base){
  const low = forms.map(f => Grammar.lower(f));
  let i = 0;
  while(i < base.length && low.every(f => i < f.length && f[i] === base[i])) i++;
  return i;
}
/* A form identical to the word (he/she is tired → yorgun) has no ending at all. */
function markEnding(form, cut){
  const end = form.slice(cut);
  return end ? `<span class="stem">-</span><b>${esc(end)}</b>` : `<span class="stem">(no ending)</span>`;
}

function pips(total, results, current){
  return `<div class="pips">${Array.from({length: total}, (_, k) => k < results.length
    ? `<i class="${results[k].correct ? "ok" : "no"}"></i>`
    : `<i class="${k === current ? "now" : ""}"></i>`).join("")}</div>`;
}

function conjHomeBody(){
  const ranked = Grammar.CATEGORIES.map(c => ({c, m: conjMastery(c.id)}));
  const low = ranked.slice().sort((a, b) => a.m - b.m)[0];
  return `
    <button class="suggest" data-act="cpick" data-id="${low.c.id}">
      <span class="mark">↗</span>
      <span class="label" style="flex:1;min-width:0">
        <span class="name">${esc(low.c.name)}</span>
        <span class="sub">Most room for improvement · ${esc(low.c.en)}</span>
      </span>
      <span class="pct num">${pct(low.m)}%</span>
    </button>

    <div class="rows">
      ${ranked.map(({c, m}) => `<button class="row" data-act="cpick" data-id="${c.id}">
        <span class="label">
          <span class="name">${esc(c.name)}</span>
          <span class="sub">${esc(c.example[0])} → ${esc(c.example[1])} · ${CONJ_POOLS[c.id].length} words</span>
          ${bar(m)}
        </span>
        <span class="pct">${pct(m)}%</span>
        <span class="chev">›</span>
      </button>`).join("")}
    </div>
    <p class="note" style="text-align:center;margin:0">
      Each category tracks all six persons against the eight harmony vowels
      (a ı · o u · e i · ö ü), so it only fills up once every ending is solid.
    </p>
    ${stats.conjugation.session_history.length ? `
      ${conjOverview("Conjugation over time")}
      <button class="ghost" data-act="progress" data-filter="c:*">All conjugation progress →</button>` : ""}`;
}

function renderConjSetup(){
  const c = Grammar.CATEGORY[view.conjCat];
  app.innerHTML = `
    ${topbar(c.name, "home")}
    <div class="sheet stack">
      <p class="note" style="margin:0"><b>${esc(c.en)}</b> · <span class="rule">${esc(c.rule)}</span></p>
      <p class="note" style="margin:0">
        You'll get a word and a person — <b>${esc(c.example[0])}</b> with <b>ben</b>, say — and pick
        <b>${esc(c.example[1])}</b> from six forms.${c.note ? " " + esc(c.note) : ""}${(() => {
          if(!prefs.markIrregular) return "";
          const irr = CONJ_POOLS[c.id].filter(e => e.irregular).map(e => conjWord(c.id, e));
          return irr.length
            ? ` Irregular words are marked <b>*</b>: ${esc(irr.slice(0, 6).join(", "))}${irr.length > 6 ? "…" : ""}.`
            : " Nothing in this category is irregular.";
        })()}
      </p>
      <div class="field">
        <span class="eyebrow">Questions</span>
        <div class="chips" data-act="ccount">
          ${[5, 10, 20].map(n => `<button data-n="${n}" aria-pressed="${view.ccount === n}">${n}</button>`).join("")}
        </div>
      </div>
    </div>
    <button class="primary" data-act="cstart">Start</button>
    <p class="note" style="text-align:center;margin:0">
      The weakest person and vowel combinations come up most often.
    </p>
    ${gridSheet(c.id, null, "Where you stand")}`;
}

function startConj(){
  const id = view.conjCat;
  const questions = selectCells(id, view.ccount).map(({p, v}) => {
    const entry = Grammar.pick(CONJ_POOLS[id].filter(e => e.vowel === v));
    return {entry, p, v,
            answer: Grammar.CATEGORY[id].form(entry, p).text,
            choices: Grammar.choices(id, entry, p, NUM_CHOICES)};
  });
  view.cquiz = {id, questions, i:0, score:0, results:[], picked:null};
  go("cquiz");
}

function renderConjQuiz(){
  const q = view.cquiz, cur = q.questions[q.i], c = Grammar.CATEGORY[q.id];
  const answered = q.picked !== null;
  const right = answered && q.picked === cur.answer;
  const cut = sharedStem(cur.choices, conjBase(q.id, cur.entry));
  app.innerHTML = `
    <div class="topbar">
      <button class="back" data-act="home" aria-label="Quit this round">✕</button>
      ${pips(q.questions.length, q.results, q.i)}
      <span class="num eyebrow">${q.i + 1}/${q.questions.length}</span>
    </div>

    <div class="sheet prompt">
      <span class="ask">${esc(c.name)} · ${esc(plainEn(cur.entry.en))}</span>
      <span class="word">${esc(conjWord(q.id, cur.entry))}${irregularMark(cur.entry)}</span>
      <span class="person">${PRONOUN[cur.p]} <small>${PERSON_EN[cur.p]}</small></span>
      ${speakButton(answered ? cur.answer : conjWord(q.id, cur.entry))}
      ${irregularMark(cur.entry) ? `<span class="irr-note">* irregular in ${esc(c.name)}</span>` : ""}
    </div>

    <div class="choices">
      ${cur.choices.map((t, i) => {
        let cls = "";
        if(answered) cls = t === cur.answer ? "right" : t === q.picked ? "wrong" : "dim";
        return `<button class="choice ${cls}" data-act="canswer" data-choice="${esc(t)}" ${answered ? "disabled" : ""}>
          <span class="k">${i + 1}</span><span class="t">${markEnding(t, cut)}</span>
        </button>`;
      }).join("")}
    </div>

    ${answered ? `<div class="verdict ${right ? "right" : "wrong"}">
      <span>${right ? "Doğru — correct" : `Answer: ${esc(cur.answer)}`}</span>
      <button data-act="cnext">${q.i + 1 === q.questions.length ? "See results" : "Next"} →</button>
    </div>` : ""}`;
}

function answerConj(choice){
  const q = view.cquiz;
  if(!q || q.picked !== null) return;
  const cur = q.questions[q.i];
  const correct = choice === cur.answer;
  const before = computeMastery(cellHistory(q.id, cur.p, cur.v));
  q.picked = choice;
  if(correct) q.score += 1;
  recordCell(q.id, cur.p, cur.v, correct);
  q.results.push({entry:cur.entry, p:cur.p, v:cur.v, answer:cur.answer, picked:choice, correct, before});
  saveStats();
  render();
  const at = q.i;
  answerFeedback(correct, cur.answer, 750, correct && prefs.autoAdvance
    ? () => { if(view.cquiz === q && q.i === at && q.picked !== null) nextConj(); }
    : null);
}

function nextConj(){
  const q = view.cquiz;
  if(!q || q.picked === null) return;
  Speech.stop();
  q.picked = null;
  if(q.i + 1 < q.questions.length){ q.i += 1; render(); return; }
  stats.conjugation.session_history.push({
    timestamp: localISO(), module:q.id, direction:"conjugation",
    score:q.score, total:q.questions.length, mastery: conjMastery(q.id)
  });
  saveStats();
  view.sitting.push({module:`Conjugation · ${Grammar.CATEGORY[q.id].name}`, direction:"conjugation",
                     score:q.score, total:q.questions.length});
  saveSitting();
  view.clast = q;
  view.cquiz = null;
  go("cresults");
}

function renderConjResults(){
  const q = view.clast, c = Grammar.CATEGORY[q.id], n = q.questions.length;
  const minus = {};
  for(const r of q.results){
    const k = cellKey(q.id, r.p, r.v);
    minus[k] = (minus[k] || 0) + 1;
  }
  const rows = q.results.map(r => {
    const h = cellHistory(q.id, r.p, r.v), after = computeMastery(h), d = after - r.before;
    return `<div class="wordrow">
      <span class="tick" style="color:${r.correct ? "var(--good)" : "var(--bad)"}">${r.correct ? "✓" : "✕"}</span>
      <span class="pair">
        <b>${esc(r.answer)}</b> <span>${esc(conjWord(q.id, r.entry))}${irregularMark(r.entry)} · ${PRONOUN[r.p]}</span>
        <span class="from">${esc(PERSON_EN[r.p])} · vowel ${vowelLabel(r.v)}${r.correct ? "" : ` · you picked ${esc(r.picked)}`}</span>
        ${wordBars(h, d)}
      </span>
      <span class="delta">${pct(after)}%<br><span style="color:${deltaColor(d)}">${signed(d)}</span></span>
    </div>`;
  }).join("");
  const hist = stats.conjugation.session_history.filter(s => s.module === q.id);

  app.innerHTML = `
    <div class="topbar"><div class="grow"><span class="eyebrow">Conjugation · ${esc(c.name)}</span></div></div>
    <div class="sheet score">
      <span class="big num">${q.score}<small>/${n}</small></span>
      <span class="say">${verdictLine(q.score, n)}</span>
    </div>

    <button class="primary" data-act="cagain">Same again — ${n} more</button>
    <div class="split">
      <button class="ghost" data-act="csetup">Change length</button>
      <button class="ghost" data-act="home">Different category</button>
    </div>

    <div class="sheet" style="overflow:hidden">
      <div class="chart" style="padding-bottom:4px">
        <h3>This round</h3>
        <p>Bars are that person and vowel's last ten answers — every word with the same vowel shares them.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:1px;background:var(--line-soft)">${rows}</div>
    </div>

    ${sittingChart()}
    ${roundsChart(hist, `${c.name} over time`,
      `What you scored in each of the last ${hist.length} round${hist.length === 1 ? "" : "s"}.`)}
    ${gridSheet(q.id, q.results, "Every ending")}
    ${accuracyChart(hist, `Lifetime accuracy in ${esc(c.name)} against the category's mastery at each round.`,
      conjMastery(q.id))}
    ${conjRanking(q.id, minus)}

    <button class="ghost" data-act="progress" data-filter="c:*">All conjugation progress →</button>`;
}

/* The grid: persons down, harmony vowels across, shaded by mastery. With
   "pairs" (the default) the vowels that share a four-way ending are merged --
   a ı, o u, e i, ö ü -- and each cell is the mean of its reachable vowels. */
const VOWEL_PAIRS = [["a", "ı"], ["o", "u"], ["e", "i"], ["ö", "ü"]];
const vowelLabel = v => prefs.vowelGrid === "all" ? v : VOWEL_PAIRS.find(pair => pair.includes(v)).join("/");
function gridSheet(id, results, title){
  const have = new Set(conjVowels(id));
  const paired = prefs.vowelGrid !== "all";
  const cols = paired ? VOWEL_PAIRS : Grammar.VOWELS.map(v => [v]);
  const hit = new Set((results || []).map(r => r.p + r.v));
  const gap = i => (!paired && i > 0 && i % 2 === 0) ? "<span></span>" : "";
  let cells = "<span></span>" + cols.map((col, i) => gap(i) + `<span class="h">${col.join(" ")}</span>`).join("");
  for(const p of PERSONS){
    cells += `<span class="h who">${PRONOUN[p]}</span>`;
    cells += cols.map((col, i) => {
      const live = col.filter(v => have.has(v));
      if(!live.length) return gap(i) + `<span class="c off" title="No words with ${col.join(" or ")}"></span>`;
      const m = meanOf(live.map(v => computeMastery(cellHistory(id, p, v))));
      const outlined = live.some(v => hit.has(p + v));
      return gap(i) + `<span class="c${outlined ? " hit" : ""}" title="${PRONOUN[p]} · ${live.join("/")} · ${pct(m)}%"
        style="background:var(--sunken);background:color-mix(in srgb, var(--data) ${pct(m)}%, var(--sunken));color:${m >= 0.55 ? "var(--surface)" : "var(--muted)"}">${pct(m)}</span>`;
    }).join("");
  }
  return `<div class="sheet" style="overflow:hidden">
    <div class="chart" style="padding-bottom:10px">
      <h3>${esc(title)}</h3>
      <p>Mastery for each person against the stem's last vowel${paired
        ? ", grouped by the pairs that take the same ending" : ", in harmony pairs"}.${
        results ? " Outlined cells came up this round." : ""}${
        cols.some(col => !col.some(v => have.has(v))) ? " Striped columns have no words in your vocab yet." : ""}
        Switch between pairs and all eight vowels in Data &amp; settings.</p>
    </div>
    <div class="grid${paired ? " pairs" : ""}">${cells}</div>
  </div>`;
}

function conjRanking(currentId, minus){
  const ranked = Grammar.CATEGORIES.map(c => {
    const m = conjMastery(c.id);
    return {c, m, delta: (c.id === currentId && minus) ? m - conjMastery(c.id, minus) : null};
  }).sort((a, b) => b.m - a.m);
  return `<div class="sheet" style="overflow:hidden">
    <div class="chart" style="padding-bottom:4px">
      <h3>All conjugations ranked</h3>
      <p>Mastery across every person and vowel each category has words for.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:1px;background:var(--line-soft)">
      ${ranked.map((r, i) => {
        const here = r.c.id === currentId, d = r.delta || 0;
        return `<div class="wordrow"${here ? ' style="background:var(--accent-wash)"' : ""}>
          <span class="tick" style="color:var(--faint);font-size:12px">${i + 1}</span>
          <span class="pair">
            <b${here ? ' style="color:var(--accent)"' : ""}>${esc(r.c.name)}</b> <span>${esc(r.c.example[1])}</span>
            ${deltaBar(r.m, d)}
          </span>
          <span class="delta">${pct(r.m)}%<br>
            <span style="color:${deltaColor(d)}">${r.delta === null ? "&nbsp;" : signed(d)}</span></span>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

/* Shared by the conjugation and sentence results and the Progress screen. */
function roundsChart(hist, title, sub){
  if(!hist.length) return "";
  return `<div class="sheet chart">
    <h3>${esc(title)}</h3>
    <p>${sub}</p>
    ${lineChart([{points: hist.map(s => s.total ? s.score / s.total : 0), color:"var(--accent)"}],
                [`${hist.length} rounds ago`, "now"])}
  </div>`;
}
function accuracyChart(hist, sub, now){
  if(!hist.length) return "";
  let cc = 0, ct = 0;
  const acc = [], mast = [];
  for(const s of hist){
    cc += s.score; ct += s.total;
    acc.push(ct ? cc / ct : 0);
    mast.push(s.mastery === null || s.mastery === undefined ? null : s.mastery);
  }
  return `<div class="sheet chart">
    <h3>Accuracy against mastery</h3>
    <p>${sub}</p>
    ${lineChart([{points:acc, color:"var(--accent)"}, {points:mast, color:"var(--gold)"}],
                [`${hist.length} rounds ago`, "now"])}
    <div class="legend">
      <span><b style="background:var(--accent)"></b>Test accuracy — ${pct(acc[acc.length - 1])}%</span>
      <span><b style="background:var(--gold)"></b>Mastery — ${pct(now)}%</span>
    </div>
  </div>`;
}

/* ===========================================================================
   Sentences mode -- an English sentence, its Turkish words shuffled; tap them
   in order. Built only from vocab modules and conjugations you've mastered.
   Each tap is final, and one that can't lead to a correct order ends it.
   =========================================================================== */
const levelHistory = id => (stats.syntax.levels[id] && stats.syntax.levels[id].history) || [];
const levelMastery = id => computeMastery(levelHistory(id));
const LEVEL_HINT = {
  easy:   "Master a conjugation together with the vocab it drills: Countries with Nerelisin, Emotions, Adjectives/People or Occupations with Feelings & jobs, Family Members or Body parts with Possession, or Verbs with a tense.",
  medium: "Needs Verbs with a tense plus Time/Days or Food, or Family Members with Possession plus Emotions or Occupations.",
  hard:   "Needs Countries with Nerelisin, Food and Time/Days with a tense, or Family Members with Possession and a tense.",
};

/* What the templates may draw from at the current threshold. */
function syntaxCtx(){
  const th = view.threshold;
  const mods = new Set(allModules().filter(([m, w]) => moduleMastery(m, w) >= th).map(([m]) => m));
  const cats = new Set(Grammar.CATEGORIES.filter(c => conjMastery(c.id) >= th).map(c => c.id));
  const cache = {};
  return {
    modules: mods.size,
    categories: cats.size,
    mastered: [...cats],
    words: slot => cache[slot] || (cache[slot] = SLOT_POOLS[slot].filter(e => mods.has(e.module))),
    has: id => cats.has(id),
    tenses: () => Grammar.TENSES.filter(t => cats.has(t)),
  };
}

function levelStatus(level, ctx){
  const ready = Grammar.TEMPLATES.filter(t => t.level === level.id && t.ready(ctx));
  const needs = [];
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  if(ctx.modules < level.modules) needs.push(`${plural(level.modules, "vocab module")} (you have ${ctx.modules})`);
  if(ctx.categories < level.categories) needs.push(`${plural(level.categories, "conjugation")} (you have ${ctx.categories})`);
  let reason = needs.length
    ? `Needs ${needs.join(" and ")} at ${pct(view.threshold)}%.`
    : (ready.length ? "" : LEVEL_HINT[level.id]);
  // Counts met but nothing to build: say what the mastered conjugations lack.
  if(!needs.length && !ready.length && level.id === "easy" && ctx.mastered.length){
    reason = "No sentence fits yet: " + ctx.mastered.map(id => {
      const c = Grammar.CATEGORY[id];
      return `${c.name} needs ${c.pairsWith} at ${pct(view.threshold)}%`;
    }).join("; ") + ".";
  }
  return {unlocked: !needs.length && ready.length > 0, ready, reason};
}

const sentenceText = (s, order) => Grammar.cap(order.map(k => s.tiles[k]).join(" ")) + ".";

/* Shuffle the tiles, but never into an order that's already correct. */
function shuffledBank(s){
  const idx = s.tiles.map((_, k) => k);
  const key = order => order.map(k => s.tiles[k]).join("|");
  const valid = new Set(s.orders.map(key));
  for(let t = 0; t < 30; t++){
    Grammar.shuffle(idx);
    if(!valid.has(key(idx))) break;
  }
  return idx.slice();
}

function syntaxHomeBody(){
  const ctx = syntaxCtx();
  return `
    <p class="note" style="margin:0">
      At ${pct(view.threshold)}% you have <b class="num">${ctx.modules}</b> vocab
      module${ctx.modules === 1 ? "" : "s"} and <b class="num">${ctx.categories}</b>
      conjugation${ctx.categories === 1 ? "" : "s"} mastered. Sentences are built only from those. Change the bar in Data &amp; settings.
    </p>
    <div class="rows">
      ${Grammar.LEVELS.map(L => {
        const st = levelStatus(L, ctx), m = levelMastery(L.id);
        const inner = `<span class="label">
            <span class="name">${L.name}</span>
            <span class="sub">${st.unlocked
              ? `${L.length} · ${st.ready.length} sentence pattern${st.ready.length === 1 ? "" : "s"} open`
              : esc(st.reason)}</span>
            ${bar(m)}
          </span>
          <span class="pct">${pct(m)}%</span>`;
        return st.unlocked
          ? `<button class="row" data-act="slevel" data-level="${L.id}">${inner}<span class="chev">›</span></button>`
          : `<div class="row locked" aria-disabled="true">${inner}<span class="chev lock">Locked</span></div>`;
      }).join("")}
    </div>
    ${stats.syntax.session_history.length ? `
      ${syntaxOverview("Sentences over time")}
      <button class="ghost" data-act="progress" data-filter="s:*">All sentence progress →</button>` : ""}`;
}

function renderSyntaxSetup(){
  const L = Grammar.LEVELS.find(l => l.id === view.synLevel);
  const ctx = syntaxCtx(), st = levelStatus(L, ctx);
  if(!st.unlocked){ view.screen = "home"; renderHome(); return; }
  const sample = Grammar.pick(st.ready).build(ctx);
  app.innerHTML = `
    ${topbar(`${L.name} sentences`, "home")}
    <div class="sheet stack">
      <p class="note" style="margin:0">
        You'll see an English sentence and its ${L.length} in Turkish, shuffled. Tap them in order —
        each tap is final, and one out of place ends the question.
      </p>
      <p class="note" style="margin:0">For example, <b>${esc(sample.en)}</b> →
        <b>${esc(sentenceText(sample, sample.orders[0]))}</b></p>
      <div class="field">
        <span class="eyebrow">Questions</span>
        <div class="chips" data-act="scount">
          ${[5, 10, 20].map(n => `<button data-n="${n}" aria-pressed="${view.scount === n}">${n}</button>`).join("")}
        </div>
      </div>
    </div>
    <button class="primary" data-act="sstart">Start</button>
    <p class="note" style="text-align:center;margin:0">

    </p>`;
}

function startSyntax(){
  const L = Grammar.LEVELS.find(l => l.id === view.synLevel);
  const ctx = syntaxCtx(), st = levelStatus(L, ctx);
  if(!st.unlocked){ toast("That level is locked"); go("home"); return; }
  const questions = [], seen = new Set();
  for(let i = 0; i < view.scount; i++){
    let s = null;
    for(let t = 0; t < 12; t++){
      s = Grammar.pick(st.ready).build(ctx);
      if(!seen.has(s.en)) break;
    }
    seen.add(s.en);
    s.bank = shuffledBank(s);
    questions.push(s);
  }
  view.squiz = {level:L.id, questions, i:0, score:0, results:[], placed:[], done:null};
  go("squiz");
}

function renderSyntaxQuiz(){
  const q = view.squiz, cur = q.questions[q.i], done = q.done;
  const lastWrong = done === "wrong" ? q.placed.length - 1 : -1;
  app.innerHTML = `
    <div class="topbar">
      <button class="back" data-act="home" aria-label="Quit this round">✕</button>
      ${pips(q.questions.length, q.results, q.i)}
      <span class="num eyebrow">${q.i + 1}/${q.questions.length}</span>
    </div>

    <div class="sheet prompt">
      <span class="ask">Say it in Turkish</span>
      <span class="sentence-en">${esc(cur.en)}</span>
      ${speakButton(done ? sentenceText(cur, cur.orders[0]) : null)}
    </div>

    <div class="line${done === "right" ? " right" : ""}" aria-live="polite">
      ${q.placed.length
        ? q.placed.map((k, j) => `<span class="tile${j === lastWrong ? " no" : ""}">${esc(cur.tiles[k])}</span>`).join("")
        : `<span class="note" style="align-self:center;margin:auto">Tap the words in order</span>`}
    </div>

    <div class="bank">
      ${cur.bank.map((k, pos) => q.placed.includes(k)
        ? `<span class="tile spent" aria-hidden="true">${esc(cur.tiles[k])}</span>`
        : `<button class="tile" data-act="stile" data-k="${k}"${done ? " disabled" : ""}
             aria-label="${esc(cur.tiles[k])}, key ${pos + 1}">${esc(cur.tiles[k])}</button>`).join("")}
    </div>

    ${done ? `<div class="verdict ${done}">
      <span>${done === "right" ? "Doğru — correct" : `Correct: ${esc(sentenceText(cur, cur.orders[0]))}`}</span>
      <button data-act="snext">${q.i + 1 === q.questions.length ? "See results" : "Next"} →</button>
    </div>` : ""}`;
}

function tapTile(k){
  const q = view.squiz;
  if(!q || q.done || q.placed.includes(k)) return;
  const cur = q.questions[q.i];
  q.placed.push(k);
  const texts = q.placed.map(i => cur.tiles[i]);
  // Compare words, not tiles, so either copy of a repeated word is fine.
  const onTrack = cur.orders.some(o => texts.every((t, j) => cur.tiles[o[j]] === t));
  if(!onTrack) finishSentence(false);
  else if(q.placed.length === cur.tiles.length) finishSentence(true);
  else render();
}

function finishSentence(correct){
  const q = view.squiz, cur = q.questions[q.i];
  q.done = correct ? "right" : "wrong";
  if(correct) q.score += 1;
  const lv = stats.syntax.levels[q.level] || (stats.syntax.levels[q.level] = {seen:0, correct:0, history:[]});
  lv.seen += 1;
  if(correct) lv.correct += 1;
  lv.history.push(correct);
  q.results.push({en:cur.en, tiles:cur.tiles, orders:cur.orders, placed:q.placed.slice(), correct});
  saveStats();
  render();
  // One effect and one reading per sentence, when it ends -- not per tile.
  const at = q.i;
  answerFeedback(correct, sentenceText(cur, cur.orders[0]), 900, correct && prefs.autoAdvance
    ? () => { if(view.squiz === q && q.i === at && q.done) nextSentence(); }
    : null);
}

function nextSentence(){
  const q = view.squiz;
  if(!q || !q.done) return;
  Speech.stop();
  q.done = null;
  q.placed = [];
  if(q.i + 1 < q.questions.length){ q.i += 1; render(); return; }
  stats.syntax.session_history.push({
    timestamp: localISO(), module:q.level, direction:"sentences",
    score:q.score, total:q.questions.length, mastery: levelMastery(q.level)
  });
  saveStats();
  const L = Grammar.LEVELS.find(l => l.id === q.level);
  view.sitting.push({module:`Sentences · ${L.name}`, direction:"sentences", score:q.score, total:q.questions.length});
  saveSitting();
  view.slast = q;
  view.squiz = null;
  go("sresults");
}

      </span>
    </div>`).join("");
  const hist = stats.syntax.session_history.filter(s => s.module === q.level);

  app.innerHTML = `
    <div class="topbar"><div class="grow"><span class="eyebrow">Sentences · ${L.name}</span></div></div>
    <div class="sheet score">

    <div class="split">
      <button class="ghost" data-act="ssetup">Change length</button>
      <button class="ghost" data-act="home">Different level</button>
    </div>

    <div class="sheet" style="overflow:hidden">
      <div class="chart" style="padding-bottom:4px">
        <h3>This round</h3>
        <p>Each sentence in its natural order, with the English you were given.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:1px;background:var(--line-soft)">${rows}</div>
    </div>

    ${sittingChart()}
    ${roundsChart(hist, `${L.name} sentences over time`,
      `What you scored in each of the last ${hist.length} round${hist.length === 1 ? "" : "s"}.`)}
    ${accuracyChart(hist, `Lifetime accuracy on ${L.name.toLowerCase()} sentences against the level's mastery at each round.`,
      levelMastery(q.level))}
    ${levelsSheet(q)}

    <button class="ghost" data-act="progress" data-filter="s:*">All sentence progress →</button>`;
}

function levelsSheet(q){
  const ctx = syntaxCtx();
  return `<div class="sheet" style="overflow:hidden">
    <div class="chart" style="padding-bottom:4px">
      <h3>Sentence levels</h3>
      <p>Mastery from each level's last ten sentences.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:1px;background:var(--line-soft)">
      ${Grammar.LEVELS.map(L => {
        const h = levelHistory(L.id), st = levelStatus(L, ctx);
        const here = q && q.level === L.id;
        const k = here ? q.results.length : 0;
        const d = k ? computeMastery(h) - computeMastery(h.slice(0, -k)) : null;
        return `<div class="wordrow"${here ? ' style="background:var(--accent-wash)"' : ""}>
          <span class="pair">

            <span>${st.unlocked ? L.length : "locked"}</span>

            <span style="color:${deltaColor(d || 0)}">${d === null ? "&nbsp;" : signed(d)}</span></span>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

/* Types ç ğ ı İ ö ş ü into whichever field was last focused, at the caret. */
function typeLetter(letter){
  const input = document.getElementById(view.focusField || "w-tr");
  if(!input) return;
  const start = typeof input.selectionStart === "number" ? input.selectionStart : input.value.length;
  const end = typeof input.selectionEnd === "number" ? input.selectionEnd : start;
  input.value = input.value.slice(0, start) + letter + input.value.slice(end);
  myDraft()[input.id === "w-en" ? "en" : "tr"] = input.value;
  input.focus();
  try{ input.setSelectionRange(start + 1, start + 1); }catch(e){}
}

function saveMyWord(){
  const d = myDraft();
  const word = {tr: tidy(d.tr), en: tidy(d.en), type: d.type || "word"};
  if(!word.tr || !word.en) return toast("Fill in both the Turkish and the English");
  if(!/[aeıioöuüâîû]/.test(Grammar.lower(word.tr))) return toast("That Turkish has no vowels — check the spelling");
  if(word.type === "verb" && !/m[ae]k$/i.test(word.tr)) return toast("Enter verbs as the infinitive, ending in -mak or -mek");
  const list = stats.custom_words;
  const editing = view.editWord !== null;
  if(list.some((w, i) => sameWord(w, word) && i !== view.editWord)) return toast("That word is already in My words");

  if(editing){
    const old = list[view.editWord];
    // A corrected spelling keeps its history: move the stats entry to the new key.
    const oldKey = wordKey(MY, old.en, old.tr), newKey = wordKey(MY, word.en, word.tr);
    if(oldKey !== newKey && stats.words[oldKey]){
      stats.words[newKey] = Object.assign(stats.words[oldKey], {english: word.en, turkish: word.tr});
      delete stats.words[oldKey];
    }
    Object.assign(old, word);
    toast(`Saved “${word.tr}”`);
  }else{
    list.push(Object.assign(word, {added: localISO()}));
    toast(`Added “${word.tr}”`);
  }
  view.editWord = null;
  view.draft = null;
  refreshVocab();
  saveStats();
  render();
}

function editMyWord(i){
  const w = stats.custom_words[i];
  if(!w) return;
  view.editWord = i;
  view.draft = {tr:w.tr, en:w.en, type:w.type || "word"};
  render();
}

function deleteMyWord(){
  const w = stats.custom_words[view.editWord];
  if(!w) return;
  if(!confirm(`Delete “${w.tr}” from My words? Its practice history is kept in case you add it back.`)) return;
  stats.custom_words.splice(view.editWord, 1);
  view.editWord = null;
  view.draft = null;
  refreshVocab();
  saveStats();
  toast(`Deleted “${w.tr}”`);
  render();
}

/* ===========================================================================
   Router + events
   =========================================================================== */
function render(){
  const s = view.screen;
  if(s === "home") renderHome();
  else if(s === "cat") renderCategory();
  else if(s === "setup") renderSetup();
  else if(s === "quiz") renderQuiz();
  else if(s === "results") renderResults();
  else if(s === "progress") renderProgress();
  else if(s === "search") renderSearch();
  else if(s === "mywords") renderMyWords();
  else if(s === "csetup") renderConjSetup();
  else if(s === "cquiz") renderConjQuiz();
  else if(s === "cresults") renderConjResults();
  else if(s === "ssetup") renderSyntaxSetup();
  else if(s === "squiz") renderSyntaxQuiz();
  else if(s === "sresults") renderSyntaxResults();
  else if(s === "data") renderData();
  window.scrollTo(0, 0);
}

function go(screen){ Speech.stop(); view.screen = screen; render(); }

function pickModule(cat, sub){
  view.mode = "module";
  view.cat = cat;
  view.module = moduleName(cat, sub);
  view.words = wordsOf(cat, sub);
  // Start from the last length you chose, trimmed to this module's size.
  view.count = Math.min(prefs.count || 5, view.words.length);
  go("setup");
}

app.addEventListener("click", ev => {
  Sound.unlock();                      // first tap anywhere readies audio on iOS
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;

  if(act === "home"){ go("home"); }
  else if(act === "tocat"){ go("cat"); }          // back out of setup, keeping view.cat
  else if(act === "cat"){
    const cat = el.dataset.cat;
    if(!cat || !VOCAB[cat]) return;
    if(isFlat(cat)) pickModule(cat, "Main");
    else { view.cat = cat; go("cat"); }
  }
  else if(act === "pick"){ pickModule(view.cat, el.dataset.sub); }
  else if(act === "quick"){
    const low = lowestMasteryModule();
    const cat = Object.keys(VOCAB).find(c =>
      Object.keys(VOCAB[c]).some(s => moduleName(c, s) === low.module));
    const sub = Object.keys(VOCAB[cat]).find(s => moduleName(cat, s) === low.module);
    pickModule(cat, sub);
  }
  else if(act === "dir"){
    const b = ev.target.closest("[data-dir]");
    if(b){ view.dir = b.dataset.dir; render(); }
  }
  else if(act === "count"){
    const b = ev.target.closest("[data-n]");
    if(b){ view.count = +b.dataset.n; prefs.count = view.count; savePrefs(); render(); }
  }
  else if(act === "auto"){
    const b = ev.target.closest("[data-v]");
    if(b){ prefs.autoAdvance = b.dataset.v === "1"; savePrefs(); render(); }
  }
  else if(act === "start"){ startQuiz(); }
  else if(act === "answer"){ answerQuiz(el.dataset.choice); }
  else if(act === "next"){ nextQuestion(); }
  else if(act === "abandon"){ view.quiz = null; go("home"); }
  else if(act === "again"){ view.count = Math.min(view.count, view.words.length); startQuiz(); }
  else if(act === "setup"){ go("setup"); }
  else if(act === "data"){ go("data"); }
  else if(act === "progress"){ if(el.dataset.filter !== undefined) view.filter = el.dataset.filter; go("progress"); }
  else if(act === "search"){ go("search"); }
  else if(act === "checkstart"){
    view.mode = "check";
    view.module = CHECK;
    go("setup");
  }
  else if(act === "threshold"){
    const b = ev.target.closest("[data-t]");
    if(b){ view.threshold = prefs.threshold = +b.dataset.t; savePrefs(); render(); }
  }
  else if(act === "qtype"){
    const b = ev.target.closest("[data-q]");
    if(b){ view.quizType = prefs.quizType = b.dataset.q; savePrefs(); render(); }
  }
  else if(act === "vgrid"){
    const b = ev.target.closest("[data-v]");
    if(b){ prefs.vowelGrid = b.dataset.v; savePrefs(); render(); }
  }
  else if(act === "irregular"){
    const b = ev.target.closest("[data-v]");
    if(b){ prefs.markIrregular = b.dataset.v === "1"; savePrefs(); render(); }
  }
  else if(act === "mywords"){ view.editWord = null; view.draft = null; go("mywords"); }
  else if(act === "wtype"){
    const b = ev.target.closest("[data-type]");
    if(b){ myDraft().type = b.dataset.type; render(); }
  }
  else if(act === "letter"){ typeLetter(el.dataset.l); }
  else if(act === "wsave"){ saveMyWord(); }
  else if(act === "wedit"){ editMyWord(+el.dataset.i); }
  else if(act === "wcancel"){ view.editWord = null; view.draft = null; render(); }
  else if(act === "wdelete"){ deleteMyWord(); }
  else if(act === "wpractice"){ pickModule(MY, "Main"); }
  else if(act === "wfromsearch"){
    view.editWord = null;
    view.draft = {tr: tidy(view.query), en:"", type:"word"};
    go("mywords");
  }
  else if(act === "speak"){ Speech.speak(el.dataset.say); }
  else if(act === "sfx"){
    const b = ev.target.closest("[data-v]");
    if(b){ prefs.sfx = b.dataset.v === "1"; savePrefs(); if(prefs.sfx) Sound.play("correct"); render(); }
  }
  else if(act === "read"){
    const b = ev.target.closest("[data-v]");
    if(b){ prefs.readAnswer = b.dataset.v === "1"; savePrefs(); render(); }
  }
  else if(act === "palette"){
    const b = ev.target.closest("[data-p]");
    if(b){ prefs.palette = b.dataset.p; savePrefs(); applyPalette(); render(); }
  }
  else if(act === "appmode"){
    const b = ev.target.closest("[data-app]");
    if(b){ view.app = prefs.app = b.dataset.app; savePrefs(); render(); }
  }
  else if(act === "cpick"){ view.conjCat = el.dataset.id; go("csetup"); }
  else if(act === "ccount"){
    const b = ev.target.closest("[data-n]");
    if(b){ view.ccount = prefs.ccount = +b.dataset.n; savePrefs(); render(); }
  }
  else if(act === "cstart" || act === "cagain"){ startConj(); }
  else if(act === "csetup"){ go("csetup"); }
  else if(act === "canswer"){ answerConj(el.dataset.choice); }
  else if(act === "cnext"){ nextConj(); }
  else if(act === "slevel"){ view.synLevel = el.dataset.level; go("ssetup"); }
  else if(act === "scount"){
    const b = ev.target.closest("[data-n]");
    if(b){ view.scount = prefs.scount = +b.dataset.n; savePrefs(); render(); }
  }
  else if(act === "sstart" || act === "sagain"){ startSyntax(); }
  else if(act === "ssetup"){ go("ssetup"); }
  else if(act === "stile"){ tapTile(+el.dataset.k); }
  else if(act === "snext"){ nextSentence(); }
  else if(act === "copy"){
    const text = JSON.stringify(stats, null, 2);
    navigator.clipboard.writeText(text)
      .then(() => toast("stats.json copied"))
      .catch(() => { document.getElementById("dump").select(); toast("Press ⌘C / Ctrl+C to copy"); });
  }
  else if(act === "pickfile"){ document.getElementById("file").click(); }
  else if(act === "import"){ importStats("replace"); }
  else if(act === "merge"){ importStats("merge"); }
  else if(act === "reset"){
    if(confirm("Erase all progress on this device? Copy stats.json first if you want a backup.")){
      stats = emptyStats(); view.sitting = []; saveSitting(); refreshVocab(); saveStats(); go("home");
    }
  }
});

/* Letter buttons mustn't steal focus from the field they type into. */
app.addEventListener("pointerdown", ev => {
  if(ev.target.closest('[data-act="letter"]')) ev.preventDefault();
});

/* Number keys answer (or pick the nth tile), Enter advances -- handy on a
   laptop, ignored on a phone. In a listening quiz, R replays the word. */
document.addEventListener("keydown", ev => {
  Sound.unlock();
  const n = parseInt(ev.key, 10);
  const advance = ev.key === "Enter" || ev.key === " ";
  if(view.screen === "quiz" && view.quiz){
    const q = view.quiz, cur = q.questions[q.i];
    if(q.listen && ev.key === "r"){ Speech.speak(cur.tur); return; }
    if(q.picked === null){ if(n >= 1 && n <= cur.choices.length) answerQuiz(cur.choices[n - 1]); }
    else if(advance){ ev.preventDefault(); nextQuestion(); }
  }else if(view.screen === "cquiz" && view.cquiz){
    const q = view.cquiz, cur = q.questions[q.i];
    if(q.picked === null){ if(n >= 1 && n <= cur.choices.length) answerConj(cur.choices[n - 1]); }
    else if(advance){ ev.preventDefault(); nextConj(); }
  }else if(view.screen === "squiz" && view.squiz){
    const q = view.squiz, cur = q.questions[q.i];
    if(!q.done){ if(n >= 1 && n <= cur.bank.length) tapTile(cur.bank[n - 1]); }
    else if(advance){ ev.preventDefault(); nextSentence(); }
  }
});

render();

/* Offline support, only where it can work: needs a real https origin, so this
   is a no-op opened from file:// and harmless anywhere sw.js isn't served. */
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
