<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Türkçe">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EAEEF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1624" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>Türkçe Practice</title>
<style>
/* ---------------------------------------------------------------------------
   İznik palette: Ottoman tile cobalt + turquoise + Armenian bole red, on cool
   blue-biased paper. Every colour is declared here in the bare :root first so
   the un-stamped (system-theme) document always resolves.
--------------------------------------------------------------------------- */
:root{
  --paper:#E9EDF2;
  --surface:#FFFFFF;
  --sunken:#F1F4F8;
  --line:#D2DAE4;
  --line-soft:#E2E8EF;
  --ink:#132A42;
  --muted:#5C7288;
  --faint:#8496A8;
  --accent:#17539B;
  --accent-ink:#FFFFFF;
  --accent-wash:#DEE8F6;
  --data:#1A8F8A;
  --bole:#BC3E2C;
  --good:#1A7F5E;
  --good-wash:#DCEFE7;
  --bad:#BC3E2C;
  --bad-wash:#F6E1DD;
  --gold:#A8762A;
  --plum:#7A4A86;
  --shadow:0 1px 2px rgba(19,42,66,.06), 0 6px 20px -12px rgba(19,42,66,.28);
  --r:14px;
  --sans:"Karla", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1624;
    --surface:#14212F;
    --sunken:#1A2939;
    --line:#27394E;
    --line-soft:#1F3043;
    --ink:#E2EAF3;
    --muted:#8CA2B9;
    --faint:#6B8199;
    --accent:#6AA8E6;
    --accent-ink:#06121F;
    --accent-wash:#1A3149;
    --data:#3FC2BA;
    --bole:#E4715D;
    --good:#3DB88C;
    --good-wash:#14332A;
    --bad:#E4715D;
    --bad-wash:#37201C;
    --gold:#D8A441;
    --plum:#B98ACB;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0C1624;
  --surface:#14212F;
  --sunken:#1A2939;
  --line:#27394E;
  --line-soft:#1F3043;
  --ink:#E2EAF3;
  --muted:#8CA2B9;
  --faint:#6B8199;
  --accent:#6AA8E6;
  --accent-ink:#06121F;
  --accent-wash:#1A3149;
  --data:#3FC2BA;
  --bole:#E4715D;
  --good:#3DB88C;
  --good-wash:#14332A;
  --bad:#E4715D;
  --bad-wash:#37201C;
  --gold:#D8A441;
  --plum:#B98ACB;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
}

/* ---------------------------------------------------------------------------
   Colour themes, picked in Data & settings (data-palette on <html>). Each one
   redefines the neutrals, accent and data colour for light and dark; anything
   a theme leaves out falls back to İznik above. Semantic colours move only
   where they'd blur into the accent: "wrong" under Nar, "right" under Zümrüt.
   Every dark block must repeat every token its light block sets.
--------------------------------------------------------------------------- */
:root[data-palette="nar"]{
  --paper:#F1ECEB; --sunken:#F7F3F2; --line:#DDD3D1; --line-soft:#E9E2E0;
  --ink:#2A1414; --muted:#6F5854; --faint:#9A8683;
  --accent:#830000; --accent-ink:#FFFFFF; --accent-wash:#F2DEDA; --data:#015E49;
  --bad:#C2560C; --bad-wash:#FBEBDD; --bole:#C2560C;
}
@media (prefers-color-scheme: dark){
  :root[data-palette="nar"]:not([data-theme="light"]){
    --paper:#160D0D; --surface:#211515; --sunken:#2A1B1B; --line:#3F2A29; --line-soft:#312121;
    --ink:#F2E6E4; --muted:#BFA5A1; --faint:#8F7773;
    --accent:#E58B80; --accent-ink:#2A0A08; --accent-wash:#3A1C1A; --data:#4FC3A1;
    --bad:#F08A3C; --bad-wash:#3A2413; --bole:#F08A3C;
  }
}
:root[data-palette="nar"][data-theme="dark"]{
  --paper:#160D0D; --surface:#211515; --sunken:#2A1B1B; --line:#3F2A29; --line-soft:#312121;
  --ink:#F2E6E4; --muted:#BFA5A1; --faint:#8F7773;
  --accent:#E58B80; --accent-ink:#2A0A08; --accent-wash:#3A1C1A; --data:#4FC3A1;
  --bad:#F08A3C; --bad-wash:#3A2413; --bole:#F08A3C;
}

:root[data-palette="zumrut"]{
  --paper:#E8EEEC; --sunken:#F1F5F4; --line:#CFDCD8; --line-soft:#DFE8E5;
  --ink:#0F2621; --muted:#52706A; --faint:#82988F;
  --accent:#015E49; --accent-ink:#FFFFFF; --accent-wash:#D6E9E3; --data:#8B663D;
  --gold:#6D6A1F; --good:#3C8D2F; --good-wash:#E2F0DA;
}
@media (prefers-color-scheme: dark){
  :root[data-palette="zumrut"]:not([data-theme="light"]){
    --paper:#0A1512; --surface:#11201C; --sunken:#172A25; --line:#24403A; --line-soft:#1B332D;
    --ink:#E1EEEA; --muted:#93B2AA; --faint:#6A857D;
    --accent:#4FC7A6; --accent-ink:#04201A; --accent-wash:#143A31; --data:#D1A574;
    --gold:#C9C46A; --good:#7CC26A; --good-wash:#1E3317;
  }
}
:root[data-palette="zumrut"][data-theme="dark"]{
  --paper:#0A1512; --surface:#11201C; --sunken:#172A25; --line:#24403A; --line-soft:#1B332D;
  --ink:#E1EEEA; --muted:#93B2AA; --faint:#6A857D;
  --accent:#4FC7A6; --accent-ink:#04201A; --accent-wash:#143A31; --data:#D1A574;
  --gold:#C9C46A; --good:#7CC26A; --good-wash:#1E3317;
}

/* #C2C2E1 is too pale to carry white text: it's the tint in light mode and the
   accent itself in dark mode. */
:root[data-palette="lavanta"]{
  --paper:#ECECF4; --sunken:#F4F4F9; --line:#D4D4E6; --line-soft:#E3E3EF;
  --ink:#1E1E33; --muted:#5E5E7A; --faint:#8C8CA6;
  --accent:#45457A; --accent-ink:#FFFFFF; --accent-wash:#C2C2E1; --data:#3E8A8A;
}
@media (prefers-color-scheme: dark){
  :root[data-palette="lavanta"]:not([data-theme="light"]){
    --paper:#13131F; --surface:#1B1B2B; --sunken:#232336; --line:#34344F; --line-soft:#2A2A40;
    --ink:#E8E8F4; --muted:#A9A9C6; --faint:#7A7A96;
    --accent:#C2C2E1; --accent-ink:#1B1B2E; --accent-wash:#2F2F4B; --data:#6CC7C2;
  }
}
:root[data-palette="lavanta"][data-theme="dark"]{
  --paper:#13131F; --surface:#1B1B2B; --sunken:#232336; --line:#34344F; --line-soft:#2A2A40;
  --ink:#E8E8F4; --muted:#A9A9C6; --faint:#7A7A96;
  --accent:#C2C2E1; --accent-ink:#1B1B2E; --accent-wash:#2F2F4B; --data:#6CC7C2;
}

:root[data-palette="kahve"]{
  --paper:#EEEAE4; --sunken:#F5F2EE; --line:#DBD2C6; --line-soft:#E7E0D6;
  --ink:#2B2118; --muted:#6F6150; --faint:#9A8C7B;
  --accent:#8B663D; --accent-ink:#FFFFFF; --accent-wash:#EADFD1; --data:#015E49;
  --gold:#5C5A12;
}
@media (prefers-color-scheme: dark){
  :root[data-palette="kahve"]:not([data-theme="light"]){
    --paper:#16110C; --surface:#211A13; --sunken:#2A2119; --line:#433627; --line-soft:#33291E;
    --ink:#F1E9DF; --muted:#BFAE98; --faint:#8C7C69;
    --accent:#D2A874; --accent-ink:#2A1B0B; --accent-wash:#3A2C1C; --data:#4FC3A1;
    --gold:#C9C46A;
  }
}
:root[data-palette="kahve"][data-theme="dark"]{
  --paper:#16110C; --surface:#211A13; --sunken:#2A2119; --line:#433627; --line-soft:#33291E;
  --ink:#F1E9DF; --muted:#BFAE98; --faint:#8C7C69;
  --accent:#D2A874; --accent-ink:#2A1B0B; --accent-wash:#3A2C1C; --data:#4FC3A1;
  --gold:#C9C46A;
}

:root[data-palette="zeytin"]{
  --paper:#ECECE3; --sunken:#F4F4EE; --line:#D6D5C4; --line-soft:#E4E3D6;
  --ink:#23220F; --muted:#66644A; --faint:#939177;
  --accent:#3E3C00; --accent-ink:#FFFFFF; --accent-wash:#E3E2CC; --data:#8B663D;
}
@media (prefers-color-scheme: dark){
  :root[data-palette="zeytin"]:not([data-theme="light"]){
    --paper:#12120A; --surface:#1B1B10; --sunken:#242416; --line:#3A3A24; --line-soft:#2C2C1B;
    --ink:#EEEDDC; --muted:#B3B191; --faint:#85836A;
    --accent:#CFCB74; --accent-ink:#1C1B05; --accent-wash:#33321A; --data:#D1A574;
  }
}
:root[data-palette="zeytin"][data-theme="dark"]{
  --paper:#12120A; --surface:#1B1B10; --sunken:#242416; --line:#3A3A24; --line-soft:#2C2C1B;
  --ink:#EEEDDC; --muted:#B3B191; --faint:#85836A;
  --accent:#CFCB74; --accent-ink:#1C1B05; --accent-wash:#33321A; --data:#D1A574;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

#app{
  max-width:640px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
          max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  gap:14px;
}

/* --- shared bits ------------------------------------------------------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.topbar{display:flex;align-items:center;gap:12px;min-height:34px}
.topbar .grow{flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);
  font-size:14px;font-weight:600;padding:6px 10px 6px 4px;margin-left:-4px}
.back:hover{color:var(--accent)}
.screen-title{font-family:var(--serif);font-size:26px;font-weight:600;
  line-height:1.1;letter-spacing:-.01em;text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.sheet{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r);box-shadow:var(--shadow)}

/* --- home -------------------------------------------------------------- */
.masthead{display:flex;flex-direction:column;gap:2px}
.masthead h1{font-family:var(--serif);font-size:34px;font-weight:600;margin:0;
  line-height:1.05;letter-spacing:-.02em}
/* Under the title rather than beside it, so a longer caption ("6 conjugations")
   can't squeeze the title onto two lines. */
.overall{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.overall b{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1.1;color:var(--accent)}

.rows{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);padding:13px 14px;transition:background .12s}
.row:hover{background:var(--sunken)}
.row .label{flex:1;min-width:0}
.row .name{font-weight:600;font-size:15px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12.5px;color:var(--faint)}
.row .pct{font-family:var(--mono);font-size:14px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--muted);flex:none;width:38px;text-align:right}
.row .chev{color:var(--faint);flex:none;font-size:15px}

.bar{height:5px;border-radius:99px;background:var(--sunken);overflow:hidden;
  margin-top:6px;border:1px solid var(--line-soft)}
.bar i{display:block;height:100%;background:var(--data);border-radius:99px}

.suggest{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:14px;border-radius:var(--r);background:var(--accent-wash);
  border:1px solid transparent}
.suggest:hover{border-color:var(--accent)}
.suggest .mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent);
  color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);
  font-size:18px;font-weight:700}
.suggest .name{font-weight:700;font-size:15.5px;display:block}
.suggest .sub{font-size:12.5px;color:var(--muted)}
.suggest .pct{font-family:var(--mono);font-weight:600;color:var(--accent);flex:none}
.suggest.check{background:transparent;border-color:var(--line)}
.suggest.check:hover{border-color:var(--data)}
.suggest.check .mark{background:var(--data);color:var(--surface)}
.suggest.check .pct{color:var(--data)}

.search{width:100%;font-family:var(--sans);font-size:16px;padding:14px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search::placeholder{color:var(--faint)}
.hit{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface)}
.hit .w{flex:1;min-width:0}
.hit .w b{font-weight:600;font-size:15px}
.hit .w span{color:var(--faint);font-size:13.5px}
.hit .w .mod{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.04em;margin-top:2px}
.hit .dirs{flex:none;display:flex;gap:10px;text-align:right}
.hit .dirs div{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.hit .dirs small{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.06em}

/* --- setup ------------------------------------------------------------- */
.field{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:6px;background:var(--sunken);padding:5px;border-radius:12px;
  border:1px solid var(--line-soft)}
.seg button{flex:1;padding:11px 8px;border-radius:8px;font-size:14.5px;font-weight:600;
  color:var(--muted);text-align:center;transition:background .12s,color .12s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 2px rgba(19,42,66,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:10px 16px;border-radius:99px;border:1px solid var(--line);
  font-family:var(--mono);font-size:14px;font-weight:500;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);
  border-color:var(--ink)}
.primary{display:block;width:100%;padding:16px;border-radius:12px;background:var(--accent);
  color:var(--accent-ink);font-size:16px;font-weight:700;letter-spacing:.01em;
  text-align:center;box-shadow:var(--shadow)}
.primary:hover{filter:brightness(1.08)}
.ghost{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);
  font-size:15px;font-weight:600;color:var(--muted);text-align:center}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

/* --- quiz -------------------------------------------------------------- */
.pips{display:flex;gap:4px;flex:1}
.pips i{height:4px;flex:1;border-radius:99px;background:var(--line)}
.pips i.ok{background:var(--good)}
.pips i.no{background:var(--bad)}
.pips i.now{background:var(--accent)}

.prompt{padding:26px 20px;text-align:center;display:flex;flex-direction:column;
  gap:10px;align-items:center}
.prompt .ask{font-size:13px;color:var(--faint);font-weight:500}
.prompt .word{font-family:var(--serif);font-size:clamp(30px,8.5vw,46px);font-weight:600;
  line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
/* Always two columns: three answers under the left thumb, three under the right. */
.choices{display:grid;gap:8px;grid-template-columns:1fr 1fr;align-items:stretch}
.choice{display:flex;align-items:center;gap:9px;padding:13px 11px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);text-align:left;font-size:15.5px;
  font-weight:500;min-height:64px;transition:border-color .12s, background .12s}
/* Hover only where there's a real pointer: on a phone the hover sticks to
   wherever you tapped, and outlined the same spot on the next question. */
@media (hover:hover){.choice:hover:not(:disabled){border-color:var(--accent)}}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--faint);flex:none;
  width:20px;height:20px;border-radius:5px;background:var(--sunken);display:grid;
  place-items:center;font-weight:500}
.choice .t{flex:1;min-width:0;overflow-wrap:anywhere}
.choice.right{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.choice.right .k{background:var(--good);color:var(--surface)}
.choice.wrong{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.choice.wrong .k{background:var(--bad);color:var(--surface)}
.choice:disabled{cursor:default}
.choice.dim{opacity:.42}

.verdict{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 15px;border-radius:12px;font-weight:600;font-size:15px}
.verdict.right{background:var(--good-wash);color:var(--good)}
.verdict.wrong{background:var(--bad-wash);color:var(--bad)}
.verdict button{font-weight:700;font-size:14px;text-decoration:underline;
  text-underline-offset:3px}

/* --- results ----------------------------------------------------------- */
.score{display:flex;align-items:center;gap:18px;padding:18px}
.score .big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;
  letter-spacing:-.03em}
.score .big small{font-size:22px;color:var(--faint);font-weight:400}
.score .say{font-size:14.5px;color:var(--muted);flex:1}

.wordrow{display:flex;align-items:center;gap:11px;padding:11px 14px;background:var(--surface)}
.wordrow .tick{width:18px;flex:none;font-weight:700;font-family:var(--mono);font-size:14px}
.wordrow .pair{flex:1;min-width:0;font-size:14.5px}
.wordrow .pair b{font-weight:600}
.wordrow .pair span{color:var(--faint)}
.wordrow .delta{font-family:var(--mono);font-size:12.5px;font-weight:500;flex:none;
  font-variant-numeric:tabular-nums}
.wordrow .from{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.04em;margin-top:2px}

/* the 10 weighted slots of compute_mastery(), most recent on the left */
.meter{display:flex;gap:2px;height:8px;margin-top:5px}
.meter i{border-radius:2px;background:var(--line)}
.meter i.y{background:var(--data)}
.meter i.n{background:var(--bole)}

/* render_mastery_change(): grey base bar with this round's gain/loss overlaid */
.dbar{display:flex;height:7px;margin-top:3px;border-radius:99px;overflow:hidden;
  background:var(--sunken);border:1px solid var(--line-soft)}
.dbar i{display:block;height:100%}
.dbar .base{background:var(--muted)}
.dbar .up{background:var(--good)}
.dbar .down{background:var(--bad)}

.chart{padding:14px 14px 10px}
.chart h3{font-size:13px;font-weight:700;margin:0 0 2px;letter-spacing:.01em}
.chart p{font-size:12px;color:var(--faint);margin:0 0 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px;
  flex-wrap:wrap}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* --- data screen ------------------------------------------------------- */
select{width:100%;font-family:var(--sans);font-size:16px;font-weight:600;padding:13px 12px;
  border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
  linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 19px) 21px, calc(100% - 14px) 21px;
  background-size:5px 5px, 5px 5px;background-repeat:no-repeat}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:13px;
  padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--sunken);
  color:var(--ink);resize:vertical}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.note code{font-family:var(--mono);font-size:12px;background:var(--sunken);
  padding:1px 5px;border-radius:4px}
.stack{display:flex;flex-direction:column;gap:10px;padding:14px}
.split{display:flex;gap:9px}
.split>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;
  border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:9}
.foot{margin-top:auto;padding-top:6px;display:flex;justify-content:center;gap:18px}
.foot button{font-size:13px;color:var(--faint);font-weight:600}
.foot button:hover{color:var(--accent)}

/* --- sound --------------------------------------------------------------- */
.speak{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;
  color:var(--accent);background:var(--accent-wash)}
.speak:hover:not(:disabled){box-shadow:inset 0 0 0 1.5px var(--accent)}
.speak:disabled{opacity:.35;cursor:default}
.speak svg{width:20px;height:20px}
.speak.big{width:68px;height:68px}
.speak.big svg{width:30px;height:30px}
.hidden-word{color:var(--faint);letter-spacing:.25em}

/* --- my words & irregulars ------------------------------------------------ */
.letters{display:flex;flex-wrap:wrap;gap:6px}
.letters button{min-width:42px;height:42px;border-radius:9px;border:1px solid var(--line);
  background:var(--sunken);font-size:18px;font-weight:600}
.letters button:active{background:var(--accent-wash)}
.irr{font-family:var(--mono);font-size:.5em;vertical-align:super;margin-left:3px;color:var(--accent)}
.irr-note{font-family:var(--mono);font-size:11.5px;color:var(--faint)}

/* --- theme picker ------------------------------------------------------ */
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swatch{display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:11px 10px;
  border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left}
.swatch:hover{border-color:var(--muted)}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.swatch .dots{display:flex;padding-left:2px}
.swatch .dots i{width:22px;height:22px;border-radius:50%;margin-left:-5px;
  box-shadow:0 0 0 2px var(--surface)}
.swatch .dots i:first-child{margin-left:0}
.swatch b{display:block;font-size:14px;font-weight:700}
.swatch small{display:block;font-size:11.5px;color:var(--faint)}

/* --- conjugation & sentences ----------------------------------------- */
.seg.modes button{font-size:13.5px;padding:10px 4px}
.person{display:inline-flex;align-items:baseline;gap:8px;padding:6px 14px;border-radius:99px;
  background:var(--accent-wash);color:var(--accent);font-weight:700;font-size:16px}
.person small{font-weight:500;font-size:12.5px;color:var(--muted)}
.rule{font-family:var(--mono);font-size:12px;color:var(--muted)}
.choice .t .stem{opacity:.55;font-weight:400}
.choice .t b{font-weight:700}
.row.locked{cursor:default}
.row.locked:hover{background:var(--surface)}
.row.locked .name,.row.locked .pct{color:var(--faint)}
.row .chev.lock{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}

/* six persons against the eight harmony vowels, in pairs: a ı · o u · e i · ö ü */
.grid{display:grid;grid-template-columns:40px 1fr 1fr 5px 1fr 1fr 5px 1fr 1fr 5px 1fr 1fr;
  gap:3px;padding:0 14px 14px}
.grid .h{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:center;align-self:center}
.grid .h.who{text-align:left}
.grid .c{aspect-ratio:1;border-radius:4px;display:grid;place-items:center;font-family:var(--mono);
  font-size:9.5px;font-variant-numeric:tabular-nums}
.grid .c.off{background:repeating-linear-gradient(45deg,var(--line) 0 1.5px,transparent 1.5px 5px)}
.grid.pairs{grid-template-columns:40px repeat(4,1fr);gap:4px}
.grid.pairs .c{aspect-ratio:auto;height:38px;font-size:11px}
.grid .c.hit{box-shadow:inset 0 0 0 2px var(--accent)}

.sentence-en{font-family:var(--serif);font-size:clamp(21px,5.6vw,28px);font-weight:600;
  line-height:1.22;letter-spacing:-.01em;text-wrap:balance}
.line{min-height:64px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:7px;padding:11px;
  border-radius:12px;border:1.5px dashed var(--line);background:var(--sunken)}
.line.right{border-style:solid;border-color:var(--good)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{display:inline-flex;align-items:center;min-height:46px;padding:10px 15px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);font-size:17px;font-weight:600;
  box-shadow:0 1px 0 var(--line)}
@media (hover:hover){button.tile:hover:not(:disabled){border-color:var(--accent)}}
button.tile:disabled{opacity:.5;cursor:default}
.tile.spent{visibility:hidden}
.line .tile{background:var(--accent-wash);border-color:transparent;box-shadow:none;color:var(--accent)}
.line.right .tile{background:var(--good-wash);color:var(--good)}
.line .tile.no{background:var(--bad-wash);color:var(--bad)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 *   two or more syllables; t softens only in the words listed
 *   a y (or s, n) buffer separates two vowels
 * Words that break a rule are listed in NOUNS and VERBS.
 */
const Grammar = (() => {
"use strict";

/* --- people ------------------------------------------------------------- */
const PERSONS = ["p1s", "p2s", "p3s", "p1p", "p2p", "p3p"];
const PRONOUN = {p1s:"ben", p2s:"sen", p3s:"o", p1p:"biz", p2p:"siz", p3p:"onlar"};
const GENITIVE = {p1s:"benim", p2s:"senin", p3s:"onun", p1p:"bizim", p2p:"sizin", p3p:"onların"};
const PERSON_EN = {p1s:"I", p2s:"you (singular)", p3s:"he / she", p1p:"we", p2p:"you (plural)", p3p:"they"};
const SUBJECT_EN = {p1s:"I", p2s:"you", p3s:"he/she", p1p:"we", p2p:"you all", p3p:"they"};
const BE_EN = {p1s:"am", p2s:"are", p3s:"is", p1p:"are", p2p:"are", p3p:"are"};
const POSSESSIVE_EN = {p1s:"my", p2s:"your", p3s:"his/her", p1p:"our", p2p:"your", p3p:"their"};

/* --- sounds ------------------------------------------------------------- */
const VOWELS = ["a", "ı", "o", "u", "e", "i", "ö", "ü"];
const FOUR = {a:"ı", ı:"ı", o:"u", u:"u", e:"i", i:"i", ö:"ü", ü:"ü"};
const BACK = new Set(["a", "ı", "o", "u"]);
const CIRCUMFLEX = {"â":"a", "î":"i", "û":"u"};
const VOICELESS = new Set([..."fstkçşhp"]);

const lower = s => s.toLocaleLowerCase("tr");
const vowelOf = ch => { const c = CIRCUMFLEX[ch] || ch; return FOUR[c] ? c : null; };
const isVowel = ch => !!vowelOf(lower(ch));
const four = v => FOUR[v];
const two = v => BACK.has(v) ? "a" : "e";
const endsInVowel = w => isVowel(w[w.length - 1]);

function lastVowel(w){
  for(let i = w.length - 1; i >= 0; i--){
    const v = vowelOf(lower(w[i]));
    if(v) return v;
  }
  return null;
}

/* Suffixes attach to the last word of a phrase: "Güney Kore" → "Güney Koreli". */
function splitLast(phrase){
  const i = phrase.lastIndexOf(" ");
  return {head: phrase.slice(0, i + 1), last: phrase.slice(i + 1)};
}

/* --- exceptions --------------------------------------------------------- */
const NOUNS = {
  // Loanwords whose suffixes take front harmony despite the spelling.
  "saat":  {vowel:"e"},
  "kalp":  {vowel:"e", soft:"kalb"},
  "rol":   {vowel:"ö"},
  "alkol": {vowel:"ö"},
  "hayal": {vowel:"e"},
  // The last vowel drops before a vowel-initial suffix: ağız → ağzım.
  "ağız":  {drop:"ağz"},
  "burun": {drop:"burn"},
  "boyun": {drop:"boyn"},
  "beyin": {drop:"beyn"},
  "göğüs": {drop:"göğs"},
  "omuz":  {drop:"omz"},
  "oğul":  {drop:"oğl"},
  "alın":  {drop:"aln"},
  "karın": {drop:"karn"},
  // Softening the general rule gets wrong in one direction or the other.
  "avukat":  {soft:false},
  "sandviç": {soft:false},
  "yoğurt":  {soft:"yoğurd"},
  "renk":    {soft:"reng"},
  // Takes a y where a vowel-final noun would take nothing: suyum, suyu.
  "su": {buffer:"y"},
  // Front harmony on an Arabic loan: meşgulüm, not meşgulum.
  "meşgul": {vowel:"ü"},
  // One syllable, but softens anyway: genç → gencim.
  "genç": {soft:"genc"},
};

const VERBS = {
  // t → d before a vowel: gitmek → gidiyor, gideceğim (but gitti).
  "git": {soft:"gid"},
  "et":  {soft:"ed"},
  "tat": {soft:"tad"},
  "güt": {soft:"güd"},
  // e → i before a y: diyor, diyecek, yiyor, yiyecek -- but dedi, yedi. The
  // present happens to fall out of the vowel-drop rule, yet every grammar
  // teaches it as irregular, so it's marked there too.
  "de":  {future:"diy", irregularIn:["present", "future"]},
  "ye":  {future:"yiy", irregularIn:["present", "future"]},
};

/* o.plain ignores the exception lists -- comparing plain and real forms is how
   a word is found to be irregular. */
const nounLex = (w, o = {}) => (!o.plain && NOUNS[w]) || {};
const verbLex = (st, o = {}) => (!o.plain && VERBS[st]) || {};
const nounVowel = (w, o = {}) => nounLex(w, o).vowel || lastVowel(w);

/* Consonant softening before a vowel-initial suffix. */
function soften(w, o){
  if(o.noSoften) return w;
  const lex = nounLex(w, o);
  if(typeof lex.soft === "string") return lex.soft;
  if(lex.soft === false) return w;
  const last = w[w.length - 1];
  if(last === "t" || !"pçkg".includes(last)) return w;
  if([...w].filter(isVowel).length < 2) return w;   // saç → saçı, top → topu
  if(last === "k") return w.slice(0, -1) + (w[w.length - 2] === "n" ? "g" : "ğ");
  return w.slice(0, -1) + {p:"b", ç:"c", g:"ğ"}[last];
}

/* Possessive stems also lose a dropping vowel. */
function possessiveStem(w, o){
  if(o.noSoften) return w;
  return nounLex(w, o).drop || soften(w, o);
}

const verbStem = inf => lower(splitLast(inf).last).replace(/m[ae]k$/, "");

/* --- forms -------------------------------------------------------------- *
 * Each takes a vocab entry {tr, en}, a person, and options used to generate
 * plausible wrong answers:
 *   forceVowel  apply harmony as if the stem's vowel were this one
 *   noSoften    skip consonant softening, vowel drop, and d → t
 *   noBuffer    skip the y / s buffer between vowels
 * and returns {text, vowel}, where vowel is the harmony vowel the form really
 * depends on -- the column of the 6 × 8 mastery grid.
 * ----------------------------------------------------------------------- */

/* Nerelisin: place + -lı, then the personal ending. Bolivya → Bolivyalıyım. */
function nerelisin(entry, p, o = {}){
  const {head, last} = splitLast(entry.tr);
  const real = lastVowel(last);
  const u = four(o.forceVowel || real);
  const base = head + last + "l" + u;
  const y = o.noBuffer ? "" : "y";
  const text = {
    p1s: base + y + u + "m",
    p2s: base + "s" + u + "n",
    p3s: base,
    p1p: base + y + u + "z",
    p2p: base + "s" + u + "n" + u + "z",
    p3p: base + "l" + two(u) + "r",
  }[p];
  return {text, vowel: real};
}

/* Feelings: the personal "to be" endings on an adjective. yorgun → yorgunum. */
function feelings(entry, p, o = {}){
  const {head, last} = splitLast(lower(entry.tr));
  const real = nounVowel(last);
  const v = o.forceVowel || nounVowel(last, o);
  const u = four(v);
  const pre = endsInVowel(last) ? last + (o.noBuffer ? "" : "y") : soften(last, o);
  const text = {
    p1s: pre + u + "m",
    p2s: last + "s" + u + "n",
    p3s: last,
    p1p: pre + u + "z",
    p2p: last + "s" + u + "n" + u + "z",
    p3p: last + "l" + two(v) + "r",
  }[p];
  return {text: head + text, vowel: real};
}

/* Possession: anne → annem, annen, annesi … kulak → kulağım, ağız → ağzım. */
function possession(entry, p, o = {}){
  const {head, last} = splitLast(lower(entry.tr));
  const real = nounVowel(last);
  const v = o.forceVowel || nounVowel(last, o);
  const u = four(v), a = two(v);
  const lex = nounLex(last, o);
  const plural = last + "l" + a + "r" + four(a);        // -ları / -leri, no softening
  let text;
  if(endsInVowel(last) && !lex.buffer){
    text = {
      p1s: last + "m",
      p2s: last + "n",
      p3s: last + (o.noBuffer ? "" : "s") + u,
      p1p: last + "m" + u + "z",
      p2p: last + "n" + u + "z",
      p3p: plural,
    }[p];
  }else{
    const s = endsInVowel(last) ? last + (o.noBuffer ? "" : lex.buffer) : possessiveStem(last, o);
    text = {
      p1s: s + u + "m",
      p2s: s + u + "n",
      p3s: s + u,
      p1p: s + u + "m" + u + "z",
      p2p: s + u + "n" + u + "z",
      p3p: plural,
    }[p];
  }
  return {text: head + text, vowel: real};
}

/* Present continuous -(ı)yor: gel → geliyor; a final vowel drops: anla → anlıyor. */
function present(entry, p, o = {}){
  const head = lower(splitLast(entry.tr).head);
  const st = verbStem(entry.tr);
  let base, real;
  if(endsInVowel(st)){
    const cut = st.slice(0, -1);
    real = lastVowel(cut) || lastVowel(st);
    base = o.noSoften
      ? st + "yor"                                      // the classic slip: anlayor
      : cut + four(o.forceVowel || real) + "yor";
  }else{
    real = lastVowel(st);
    const s = o.noSoften ? st : (verbLex(st, o).soft || st);
    base = s + four(o.forceVowel || real) + "yor";
  }
  const text = {
    p1s: base + "um", p2s: base + "sun", p3s: base,
    p1p: base + "uz", p2p: base + "sunuz", p3p: base + "lar",
  }[p];
  return {text: head + text, vowel: real};
}

/* Going to -(y)acak/-(y)ecek; k → ğ before -ım/-ız: gideceğim, gidecek. */
function future(entry, p, o = {}){
  const head = lower(splitLast(entry.tr).head);
  const st = verbStem(entry.tr);
  const real = lastVowel(st);
  const a = two(o.forceVowel || real);
  const u = four(a);
  const lex = verbLex(st, o);
  const s = lex.future && !o.noSoften ? lex.future          // demek → diyecek
    : endsInVowel(st) ? st + (o.noBuffer ? "" : "y")
    : (o.noSoften ? st : (lex.soft || st));
  const k = a === "a" ? "acak" : "ecek";
  const g = o.noSoften ? k : k.slice(0, -1) + "ğ";
  const text = {
    p1s: s + g + u + "m",
    p2s: s + k + "s" + u + "n",
    p3s: s + k,
    p1p: s + g + u + "z",
    p2p: s + k + "s" + u + "n" + u + "z",
    p3p: s + k + "l" + a + "r",
  }[p];
  return {text: head + text, vowel: real};
}

/* Past -dı/-tı: gel → geldim, git → gittim, çalış → çalıştım. */
function past(entry, p, o = {}){
  const head = lower(splitLast(entry.tr).head);
  const st = verbStem(entry.tr);
  const real = lastVowel(st);
  const v = o.forceVowel || real;
  const u = four(v);
  const d = !o.noSoften && VOICELESS.has(st[st.length - 1]) ? "t" : "d";
  const base = st + d + u;
  const text = {
    p1s: base + "m", p2s: base + "n", p3s: base,
    p1p: base + "k", p2p: base + "n" + u + "z", p3p: base + "l" + two(v) + "r",
  }[p];
  return {text: head + text, vowel: real};
}

/* --- which vocab each form can use -------------------------------------- */
const usable = tr => !/[\/_]|see below/i.test(tr) && lastVowel(tr) !== null;

// Multi-word names that already carry a suffix, and plural names, don't take -lı
// cleanly (Amerika Birleşik Devletleri, Filipinler).
const acceptPlace = tr =>
  !/\s(Cumhuriyeti|Devletleri|Emirlikleri|Kıyısı)$/.test(tr) && !/^\S+l[ae]r$/.test(tr);
// "Kafası karışık" conjugates inside the phrase (kafaları karışık), not at the end.
const acceptFeeling = tr => tr !== "Kafası karışık";
// A compound that already ends in a possessive (Ayak bileği) can't take another.
const acceptPossessed = tr => !(/\s/.test(tr) && /s?[ıiuü]$/.test(tr));
// Any infinitive; the irregular ones (demek, yemek, gitmek…) are listed in VERBS.
const acceptVerb = tr => /m[ae]k$/i.test(tr);

const CATEGORIES = [
  {id:"nerelisin",  name:"Nerelisin",          en:"I am from…",
   rule:"-lı · -li · -lu · -lü, then “to be”",   example:["Bolivya", "Bolivyalıyım"],
   note:"This is the everyday “from X” form; some countries also have their own nationality word (Alman, Fransız, İngiliz).",
   pairsWith:"a Countries module",
   source: m => m.startsWith("Countries/"), custom:"place", accept: acceptPlace, keepCase:true, form: nerelisin},
  {id:"feelings",   name:"Feelings & jobs",    en:"I am tired · a teacher · young",
   rule:"-(y)ım · -sın · — · -(y)ız · -sınız · -lar", example:["yorgun", "yorgunum"],
   note:"Occupations and adjectives for people share the same endings and fill in the vowels emotions lack (o, e, ö).",
   pairsWith:"Emotions, Adjectives/People or Occupations",
   source: m => m === "Emotions" || m === "Occupations" || m === "Adjectives/People",
   custom:"adjective", accept: acceptFeeling, form: feelings},
  {id:"possession", name:"Possession",         en:"my mother, your hand",
   rule:"-(ı)m · -(ı)n · -(s)ı · -(ı)mız · -(ı)nız · -ları", example:["kulak", "kulağım"],
   pairsWith:"a Family Members or Parts Of The Body module",
   source: m => m.startsWith("Family Members/") || m.startsWith("Parts Of The Body/"),
   custom:"noun", accept: acceptPossessed, form: possession},
  {id:"present",    name:"Present continuous", en:"I am going",
   rule:"-(ı)yor + -um · -sun · — · -uz · -sunuz · -lar", example:["gitmek", "gidiyorum"],
   pairsWith:"Verbs or More Verbs",
   source: m => m === "Verbs" || m === "More Verbs", custom:"verb", accept: acceptVerb, verb:true, form: present},
  {id:"future",     name:"Going to",           en:"I am going to go",
   rule:"-(y)acak · -(y)ecek, k → ğ before a vowel", example:["gitmek", "gideceğim"],
   pairsWith:"Verbs or More Verbs",
   source: m => m === "Verbs" || m === "More Verbs", custom:"verb", accept: acceptVerb, verb:true, form: future},
  {id:"past",       name:"Past",               en:"I went",
   rule:"-dı · -tı + -m · -n · — · -k · -nız · -lar", example:["gitmek", "gittim"],
   pairsWith:"Verbs or More Verbs",
   source: m => m === "Verbs" || m === "More Verbs", custom:"verb", accept: acceptVerb, verb:true, form: past},
];
const CATEGORY = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));
const TENSES = ["present", "future", "past"];

function eachEntry(vocab, fn){
  for(const [cat, subs] of Object.entries(vocab)){
    const keys = Object.keys(subs);
    const flat = keys.length === 1 && keys[0] === "Main";
    for(const [sub, words] of Object.entries(subs)){
      const module = flat ? cat : `${cat}/${sub}`;
      for(const [en, tr] of words) fn({en, tr, module});
    }
  }
}

/* Irregular in a category = the exception lists change any of its six forms
   there, or VERBS says so outright. So gitmek is irregular in the present
   (gidiyor) but not the past (gitti). */
function isIrregular(categoryId, entry){
  const c = CATEGORY[categoryId];
  if(c.verb && ((VERBS[verbStem(entry.tr)] || {}).irregularIn || []).includes(categoryId)) return true;
  return PERSONS.some(p => c.form(entry, p).text !== c.form(entry, p, {plain:true}).text);
}

/* {categoryId: [{en, tr, module, vowel, irregular}]}, de-duplicated on the
   Turkish. `extra` is My Words, each routed by the type the user picked. */
function buildPools(vocab, extra = []){
  const pools = {};
  for(const c of CATEGORIES){
    const seen = new Set(), list = [];
    const add = e => {
      if(!usable(e.tr) || !c.accept(e.tr) || seen.has(e.tr)) return;
      seen.add(e.tr);
      list.push(Object.assign({}, e, {vowel: c.form(e, "p3s").vowel, irregular: isIrregular(c.id, e)}));
    };
    eachEntry(vocab, e => { if(c.source(e.module)) add(e); });
    for(const e of extra) if(c.custom && e.type === c.custom) add(e);
    pools[c.id] = list;
  }
  return pools;
}

/* --- answer buttons ----------------------------------------------------- */
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const pick = a => a[Math.floor(Math.random() * a.length)];

/* The right form, plus wrong answers that each test one thing: a slip in the
   consonant / buffer rule, the wrong harmony, the wrong person. */
function choices(categoryId, entry, person, n = 6){
  const form = CATEGORY[categoryId].form;
  const correct = form(entry, person).text;
  const out = [correct];
  const take = (list, k) => {
    let added = 0;
    for(const t of list){
      if(added >= k || out.length >= n) return;
      if(!out.includes(t)){ out.push(t); added++; }
    }
  };
  const others = shuffle(PERSONS.filter(q => q !== person));
  const vowels = shuffle(VOWELS.slice());

  take(shuffle([{noSoften:true}, {noBuffer:true}].map(o => form(entry, person, o).text)), 1);
  take(vowels.map(v => form(entry, person, {forceVowel:v}).text), 2);
  take(others.map(q => form(entry, q).text), 2);
  for(const q of others){                                    // wrong on both counts
    take(vowels.map(v => form(entry, q, {forceVowel:v}).text), n);
  }
  return shuffle(out.slice(0, n));
}

/* --- sentences ---------------------------------------------------------- */
const INTRANSITIVE = {
  "Gitmek":    {base:"go",         ing:"going",       past:"went",       group:true},
  "Gelmek":    {base:"come",       ing:"coming",      past:"came",       group:true},
  "Beklemek":  {base:"wait",       ing:"waiting",     past:"waited",     group:true},
  "Çalışmak":  {base:"work",       ing:"working",     past:"worked",     group:true},
  "Düşünmek":  {base:"think",      ing:"thinking",    past:"thought"},
  "Anlamak":   {base:"understand", s:"understands",   past:"understood", stative:true},
  "Bakmak":    {base:"look",       ing:"looking",     past:"looked"},
  "Denemek":   {base:"try",        ing:"trying",      past:"tried"},
  "Uyumak":    {base:"sleep",      ing:"sleeping",    past:"slept",      group:true},
  "Yürümek":   {base:"walk",       ing:"walking",     past:"walked",     group:true},
  "Koşmak":    {base:"run",        ing:"running",     past:"ran"},
  "Oynamak":   {base:"play",       ing:"playing",     past:"played",     group:true},
  "Konuşmak":  {base:"talk",       ing:"talking",     past:"talked"},
  "Okumak":    {base:"read",       ing:"reading",     past:"read"},
  "Yazmak":    {base:"write",      ing:"writing",     past:"wrote"},
  "Oturmak":   {base:"sit",        ing:"sitting",     past:"sat"},
  "Çıkmak":    {base:"go out",     ing:"going out",   past:"went out",   group:true},
  "Dönmek":    {base:"come back",  ing:"coming back", past:"came back",  group:true},
  "Kalmak":    {base:"stay",       ing:"staying",     past:"stayed",     group:true},
};
const TRANSITIVE = {
  "Almak":     {base:"buy",  ing:"buying", past:"bought"},
  "İstemek":   {base:"want", s:"wants",    past:"wanted", stative:true, tenses:["present", "past"]},
  "Yemek":     {base:"eat",   ing:"eating",   past:"ate",   objects: en => !DRINKS.has(en) && !SEASONING.has(en)},
  "İçmek":     {base:"drink", ing:"drinking", past:"drank", objects: en => DRINKS.has(en)},
};
const TIME_WORDS = {
  "Bugün": {en:"today",     tenses:["present", "future", "past"]},
  "Dün":   {en:"yesterday", tenses:["past"]},
  "Yarın": {en:"tomorrow",  tenses:["future"]},
};
// Uncountable in English, so "I bought ___" reads naturally without an article.
const MASS_FOODS = new Set(["Water", "Bread", "Meat", "Cheese", "Milk", "Rice", "Pasta", "Soup",
  "Salad", "Fruit", "Salt", "Sugar", "Tea", "Coffee", "Yogurt", "Chicken", "Fish", "Ice-cream",
  "Chocolate", "Lamb"]);
// What you can drink, and what you wouldn't say you ate on its own.
const DRINKS = new Set(["Water", "Milk", "Tea", "Coffee"]);
const SEASONING = new Set(["Salt", "Sugar"]);

const SLOTS = {
  country:    {source: m => m.startsWith("Countries/"),      accept: e => acceptPlace(e.tr), custom:"place"},
  emotion:    {source: m => m === "Emotions" || m === "Adjectives/People",
               accept: e => acceptFeeling(e.tr), custom:"adjective"},
  family:     {source: m => m.startsWith("Family Members/"), accept: e => acceptPossessed(e.tr)},
  // Everything Possession drills: family and body parts, plus your own nouns.
  possessed:  {source: m => m.startsWith("Family Members/") || m.startsWith("Parts Of The Body/"),
               accept: e => acceptPossessed(e.tr), custom:"noun"},
  verb:       {source: m => m === "Verbs" || m === "More Verbs", accept: e => !!INTRANSITIVE[e.tr]},
  objectVerb: {source: m => m === "Verbs" || m === "More Verbs", accept: e => !!TRANSITIVE[e.tr]},
  food:       {source: m => m.startsWith("Food/"),           accept: e => MASS_FOODS.has(e.en) && !/\s/.test(e.tr)},
  occupation: {source: m => m === "Occupations",             accept: () => true},
  time:       {source: m => m === "Time/Days",               accept: e => !!TIME_WORDS[e.tr]},
};

/* {slot: [{en, tr, module}]} -- the app narrows these to mastered modules. */
function buildSlotPools(vocab, extra = []){
  const pools = {};
  for(const [slot, def] of Object.entries(SLOTS)){
    const seen = new Set(), list = [];
    const add = e => {
      if(!usable(e.tr) || !def.accept(e) || seen.has(e.tr)) return;
      seen.add(e.tr);
      list.push(e);
    };
    eachEntry(vocab, e => { if(def.source(e.module)) add(e); });
    for(const e of extra) if(def.custom && e.type === def.custom) add(e);
    pools[slot] = list;
  }
  return pools;
}

const cap = s => s.charAt(0).toLocaleUpperCase("tr") + s.slice(1);
const plainEn = en => en.replace(/\s*\(.*?\)/g, "").trim();
const lowEn = en => plainEn(en).toLowerCase();
const midSubject = p => p === "p1s" ? "I" : SUBJECT_EN[p];
const article = en => /^[aeiou]/i.test(en) ? "an" : "a";
const verbEntry = v => ({tr: v.tr, en: v.en});
const FORM_OF = {present, future, past};

function englishVerb(v, tense, p){
  if(tense === "present"){
    if(v.stative) return p === "p3s" ? v.s : v.base;
    return `${BE_EN[p]} ${v.ing}`;
  }
  if(tense === "future") return `${BE_EN[p]} going to ${v.base}`;
  return v.past;
}

/* Verb / time / tense combinations the learner can actually be asked. */
function timedVerbs(ctx, slot, table, filter = () => true){
  const out = [];
  for(const t of ctx.words("time")){
    for(const v of ctx.words(slot)){
      const info = table[v.tr];
      if(!filter(info)) continue;
      for(const tense of TIME_WORDS[t.tr].tenses){
        if(ctx.tenses().includes(tense) && (!info.tenses || info.tenses.includes(tense))){
          out.push({t, v, tense, info});
        }
      }
    }
  }
  return out;
}
function tensedVerbs(ctx, slot, table, filter = () => true){
  const out = [];
  for(const v of ctx.words(slot)){
    const info = table[v.tr];
    if(!filter(info)) continue;
    for(const tense of ctx.tenses()){
      if(!info.tenses || info.tenses.includes(tense)) out.push({v, tense, info});
    }
  }
  return out;
}
/* Object verbs paired with the foods that make sense after them. */
function objectOptions(ctx, timed, minFoods){
  const base = timed ? timedVerbs(ctx, "objectVerb", TRANSITIVE) : tensedVerbs(ctx, "objectVerb", TRANSITIVE);
  return base
    .map(o => Object.assign(o, {foods: ctx.words("food").filter(f => !o.info.objects || o.info.objects(f.en))}))
    .filter(o => o.foods.length >= minFoods);
}
const distinct = (list, k) => shuffle(list.slice()).slice(0, k);
// Pair different people, not "you" with "you all".
const personsExcept = p => PERSONS.filter(q => q[1] !== p[1]);
// A spouse has one owner -- "our husband" isn't a sentence anyone says.
const ONE_OWNER = new Set(["Koca", "Hanım", "Eş"]);
const ownerFor = (...family) => pick(family.some(f => ONE_OWNER.has(f.tr)) ? ["p1s", "p2s", "p3s"] : PERSONS);

/* Each template: a level, a check that it can be filled from what's mastered,
   and a builder returning the English prompt, the Turkish tiles in their
   natural order, and every order that counts as correct (as tile indices). */
const TEMPLATES = [
  {id:"from", level:"easy",
   ready: c => c.words("country").length > 0 && c.has("nerelisin"),
   build(c){
     const place = pick(c.words("country")), p = pick(PERSONS);
     return {en: `${cap(SUBJECT_EN[p])} ${BE_EN[p]} from ${plainEn(place.en)}.`,
             tiles: [PRONOUN[p], nerelisin(place, p).text], orders: [[0, 1]]};
   }},
  {id:"feel", level:"easy",
   ready: c => c.words("emotion").length > 0 && c.has("feelings"),
   build(c){
     const e = pick(c.words("emotion")), p = pick(PERSONS);
     return {en: `${cap(SUBJECT_EN[p])} ${BE_EN[p]} ${lowEn(e.en)}.`,
             tiles: [PRONOUN[p], feelings(e, p).text], orders: [[0, 1]]};
   }},
  {id:"job", level:"easy",
   ready: c => c.words("occupation").length > 0 && c.has("feelings"),
   build(c){
     // Singular people only, so the English stays "a teacher" without plurals.
     const j = pick(c.words("occupation")), p = pick(["p1s", "p2s", "p3s"]);
     const job = lowEn(j.en);
     return {en: `${cap(SUBJECT_EN[p])} ${BE_EN[p]} ${article(job)} ${job}.`,
             tiles: [PRONOUN[p], feelings(j, p).text], orders: [[0, 1]]};
   }},
  {id:"mine", level:"easy",
   ready: c => c.words("possessed").length > 0 && c.has("possession"),
   build(c){
     const f = pick(c.words("possessed")), p = ownerFor(f);
     return {en: `${cap(POSSESSIVE_EN[p])} ${lowEn(f.en)}.`,
             tiles: [GENITIVE[p], possession(f, p).text], orders: [[0, 1]]};
   }},
  {id:"doing", level:"easy",
   ready: c => tensedVerbs(c, "verb", INTRANSITIVE).length > 0,
   build(c){
     const {v, tense, info} = pick(tensedVerbs(c, "verb", INTRANSITIVE)), p = pick(PERSONS);
     return {en: `${cap(SUBJECT_EN[p])} ${englishVerb(info, tense, p)}.`,
             tiles: [PRONOUN[p], FORM_OF[tense](verbEntry(v), p).text], orders: [[0, 1]]};
   }},

  {id:"when", level:"medium",
   ready: c => timedVerbs(c, "verb", INTRANSITIVE).length > 0,
   build(c){
     const {t, v, tense, info} = pick(timedVerbs(c, "verb", INTRANSITIVE)), p = pick(PERSONS);
     return {en: `${cap(TIME_WORDS[t.tr].en)} ${midSubject(p)} ${englishVerb(info, tense, p)}.`,
             tiles: [lower(t.tr), PRONOUN[p], FORM_OF[tense](verbEntry(v), p).text],
             orders: [[0, 1, 2], [1, 0, 2]]};
   }},
  {id:"object", level:"medium",
   ready: c => objectOptions(c, false, 1).length > 0,
   build(c){
     const {v, tense, info, foods} = pick(objectOptions(c, false, 1));
     const f = pick(foods), p = pick(PERSONS);
     return {en: `${cap(SUBJECT_EN[p])} ${englishVerb(info, tense, p)} ${lowEn(f.en)}.`,
             tiles: [PRONOUN[p], lower(f.tr), FORM_OF[tense](verbEntry(v), p).text],
             orders: [[0, 1, 2]]};
   }},
  {id:"family-feel", level:"medium",
   ready: c => c.words("family").length > 0 && c.words("emotion").length > 0 && c.has("possession"),
   build(c){
     const f = pick(c.words("family")), e = pick(c.words("emotion")), p = ownerFor(f);
     return {en: `${cap(POSSESSIVE_EN[p])} ${lowEn(f.en)} is ${lowEn(e.en)}.`,
             tiles: [GENITIVE[p], possession(f, p).text, lower(e.tr)], orders: [[0, 1, 2]]};
   }},
  {id:"family-job", level:"medium",
   ready: c => c.words("family").length > 0 && c.words("occupation").length > 0 && c.has("possession"),
   build(c){
     const f = pick(c.words("family")), j = pick(c.words("occupation")), p = ownerFor(f);
     const job = lowEn(j.en);
     return {en: `${cap(POSSESSIVE_EN[p])} ${lowEn(f.en)} is ${article(job)} ${job}.`,
             tiles: [GENITIVE[p], possession(f, p).text, lower(j.tr)], orders: [[0, 1, 2]]};
   }},

  {id:"two-places", level:"hard",
   ready: c => c.words("country").length > 1 && c.has("nerelisin"),
   build(c){
     const [a, b] = distinct(c.words("country"), 2);
     const p = pick(PERSONS), q = pick(personsExcept(p));
     return {en: `${cap(SUBJECT_EN[p])} ${BE_EN[p]} from ${plainEn(a.en)} and ${midSubject(q)} ${BE_EN[q]} from ${plainEn(b.en)}.`,
             tiles: [PRONOUN[p], nerelisin(a, p).text, "ve", PRONOUN[q], nerelisin(b, q).text],
             orders: [[0, 1, 2, 3, 4], [3, 4, 2, 0, 1]]};
   }},
  {id:"shopping", level:"hard",
   ready: c => objectOptions(c, true, 2).length > 0,
   build(c){
     const {t, v, tense, info, foods} = pick(objectOptions(c, true, 2));
     const [f, g] = distinct(foods, 2), p = pick(PERSONS);
     return {en: `${cap(TIME_WORDS[t.tr].en)} ${midSubject(p)} ${englishVerb(info, tense, p)} ${lowEn(f.en)} and ${lowEn(g.en)}.`,
             tiles: [lower(t.tr), PRONOUN[p], lower(f.tr), "ve", lower(g.tr), FORM_OF[tense](verbEntry(v), p).text],
             orders: [[0, 1, 2, 3, 4, 5], [1, 0, 2, 3, 4, 5], [0, 1, 4, 3, 2, 5], [1, 0, 4, 3, 2, 5]]};
   }},
  {id:"family-plans", level:"hard",
   ready: c => c.words("family").length > 1 && c.has("possession")
            && timedVerbs(c, "verb", INTRANSITIVE, i => i.group).length > 0,
   build(c){
     const {t, v, tense, info} = pick(timedVerbs(c, "verb", INTRANSITIVE, i => i.group));
     const [f, g] = distinct(c.words("family"), 2), p = ownerFor(f, g);
     const my = POSSESSIVE_EN[p];
     return {en: `${cap(TIME_WORDS[t.tr].en)} ${my} ${lowEn(f.en)} and ${my} ${lowEn(g.en)} ${englishVerb(info, tense, "p3p")}.`,
             tiles: [lower(t.tr), possession(f, p).text, "ve", possession(g, p).text, FORM_OF[tense](verbEntry(v), "p3p").text],
             orders: [[0, 1, 2, 3, 4], [1, 2, 3, 0, 4], [0, 3, 2, 1, 4], [3, 2, 1, 0, 4]]};
   }},
  {id:"family-origin", level:"hard",
   ready: c => c.words("family").length > 0 && c.words("country").length > 0 && c.words("emotion").length > 0
            && c.has("possession") && c.has("nerelisin"),
   build(c){
     const f = pick(c.words("family")), place = pick(c.words("country")), e = pick(c.words("emotion"));
     const p = ownerFor(f);
     return {en: `${cap(POSSESSIVE_EN[p])} ${lowEn(f.en)} is from ${plainEn(place.en)} and ${lowEn(e.en)}.`,
             tiles: [GENITIVE[p], possession(f, p).text, nerelisin(place, "p3s").text, "ve", lower(e.tr)],
             orders: [[0, 1, 2, 3, 4], [0, 1, 4, 3, 2]]};
   }},
];

/* To unlock a level you need this many vocab modules and conjugation
   categories mastered, and at least one of its templates fillable. */
const LEVELS = [
  {id:"easy",   name:"Easy",   length:"2 words",   modules:1, categories:1},
  {id:"medium", name:"Medium", length:"3 words",   modules:3, categories:2},
  {id:"hard",   name:"Hard",   length:"5–6 words", modules:5, categories:3},
];

return {
  PERSONS, PRONOUN, GENITIVE, PERSON_EN, VOWELS, CATEGORIES, CATEGORY, TENSES,
  TEMPLATES, LEVELS, SLOTS,
  buildPools, buildSlotPools, isIrregular, choices, shuffle, pick, lower, cap,
  forms: {nerelisin, feelings, possession, present, future, past},
};
})();

if(typeof module !== "undefined" && module.exports) module.exports = Grammar;

</script>

<script>
"use strict";

/* ===========================================================================
   Mastery -- a direct port of mastery.py. Keep the weights in sync with it.
   =========================================================================== */
const MASTERY_WEIGHTS = [0.30, 0.25, 0.20, 0.10, 0.05, 0.02, 0.02, 0.02, 0.02, 0.02];
const WINDOW = MASTERY_WEIGHTS.length;

function computeMastery(history){
  if(!history || !history.length) return 0;
  const recent = history.slice(-WINDOW);
  let score = 0;
  for(let i = 0; i < recent.length; i++){
    if(recent[recent.length - 1 - i]) score += MASTERY_WEIGHTS[i];
  }
  return score;
}

/* ===========================================================================
   Stats -- identical shape to stats.json so the CLI and the app can trade
   files through the Data screen. See CLAUDE.md for the schema.
   =========================================================================== */
const STORE_KEY = "turkishPracticeStats";
const PREFS_KEY = "turkishPracticePrefs";
const DIRS = ["en_to_tr", "tr_to_en"];

const VOCAB = JSON.parse(document.getElementById("vocab-data").textContent);

function emptyStats(){
  return {words:{}, modules:{}, sessions:0, session_history:[],
          conjugation:{cells:{}, session_history:[]}, syntax:{levels:{}, session_history:[]},
          custom_words:[]};
}
function loadStats(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return normalize(JSON.parse(raw));
  }catch(e){ /* private mode, blocked storage -- run from memory */ }
  return emptyStats();
}
function saveStats(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(stats)); }catch(e){}
}
function normalize(s){
  s.words = s.words || {};
  s.modules = s.modules || {};
  s.sessions = s.sessions || 0;
  s.session_history = s.session_history || [];
  // Conjugation and Sentences keep their own keys. The Python CLI never reads
  // them, and its json.load / json.dump round trip carries them through intact.
  s.conjugation = Object.assign({cells:{}, session_history:[]}, s.conjugation);
  s.syntax = Object.assign({levels:{}, session_history:[]}, s.syntax);
  // My words: [{en, tr, type, added}] -- in stats so backups carry them.
  s.custom_words = Array.isArray(s.custom_words) ? s.custom_words : [];
  // Mirror _migrate_module_names(), but only for the all-lowercase legacy names
  // it was written for -- title-casing a name that already has capitals risks
  // mangling Turkish dotted capitals (İ) and breaking the word key.
  const fix = m => (m === m.toLowerCase()
    ? m.replace(/([a-zçğıöşü])([a-zçğıöşü]*)/gi, (_, a, b) => a.toUpperCase() + b)
    : m);
  const words = {};
  for(const [key, w] of Object.entries(s.words)){
    const nm = fix(w.module);
    if(nm !== w.module){
      words[key.replace(w.module + "|", nm + "|")] = Object.assign(w, {module:nm});
    } else words[key] = w;
  }
  s.words = words;
  const mods = {};
  for(const [m, d] of Object.entries(s.modules)){
    const nm = fix(m);
    if(mods[nm]){
      for(const dir of DIRS){
        mods[nm][dir].asked += d[dir].asked;
        mods[nm][dir].correct += d[dir].correct;
      }
      mods[nm].sessions += d.sessions;
    } else mods[nm] = d;
  }
  s.modules = mods;
  for(const e of s.session_history) e.module = fix(e.module);
  return s;
}

const wordKey = (module, eng, tur) => `${module}|${eng}|${tur}`;

/* datetime.now().isoformat() -- local time, no timezone suffix, as Python writes it */
function localISO(){
  const d = new Date(), p = (n, w = 2) => String(n).padStart(w, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T` +
         `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.` +
         `${p(d.getMilliseconds(),3)}000`;
}

function historyOf(module, eng, tur, dir){
  const w = stats.words[wordKey(module, eng, tur)];
  return (w && w[dir] && w[dir].history) || [];
}

function recordAnswer(module, eng, tur, dir, correct){
  const key = wordKey(module, eng, tur);
  if(!stats.words[key]){
    stats.words[key] = {
      module, english:eng, turkish:tur,
      en_to_tr:{seen:0, correct:0, history:[]},
      tr_to_en:{seen:0, correct:0, history:[]},
      last_seen:null
    };
  }
  const w = stats.words[key];
  if(!w[dir].history) w[dir].history = [];
  w[dir].seen += 1;
  if(correct) w[dir].correct += 1;
  w[dir].history.push(correct);
  w.last_seen = localISO();
}

/* `snapshot` is the mastery figure stored with the session: mean module mastery
   for a normal round, mean mastery of the qualifying pool for a Mastery Check. */
function recordSession(module, dir, score, total, snapshot){
  if(!stats.modules[module]){
    stats.modules[module] = {sessions:0, en_to_tr:{asked:0,correct:0}, tr_to_en:{asked:0,correct:0}};
  }
  const m = stats.modules[module];
  m.sessions += 1;
  m[dir].asked += total;
  m[dir].correct += score;
  stats.sessions += 1;
  stats.session_history.push({
    timestamp: localISO(), module, direction:dir, score, total,
    mastery: snapshot
  });
}

/* --- aggregates ---------------------------------------------------------- */
function moduleMastery(module, words){
  if(!words || !words.length) return 0;
  let total = 0;
  for(const [eng, tur] of words){
    for(const dir of DIRS) total += computeMastery(historyOf(module, eng, tur, dir));
  }
  return total / (words.length * 2);
}
function categoryMastery(cat){
  const subs = VOCAB[cat];
  let total = 0, count = 0;
  for(const [sub, words] of Object.entries(subs)){
    const module = moduleName(cat, sub);
    for(const [eng, tur] of words){
      for(const dir of DIRS) total += computeMastery(historyOf(module, eng, tur, dir));
      count += 2;
    }
  }
  return count ? total / count : 0;
}
/* Categories whose only focus is "Main" flatten to the category name. */
const isFlat = cat => {const k = Object.keys(VOCAB[cat]); return k.length === 1 && k[0] === "Main";};
const moduleName = (cat, sub) => isFlat(cat) ? cat : `${cat}/${sub}`;
const wordsOf = (cat, sub) => VOCAB[cat][sub];
const countWords = cat => Object.values(VOCAB[cat]).reduce((n, w) => n + w.length, 0);

function allModules(){
  const out = [];
  for(const cat of Object.keys(VOCAB)){
    for(const sub of Object.keys(VOCAB[cat])) out.push([moduleName(cat, sub), wordsOf(cat, sub)]);
  }
  return out;
}
function lowestMasteryModule(){
  let best = null;
  for(const [module, words] of allModules()){
    const m = moduleMastery(module, words);
    if(!best || m < best.m || (m === best.m && module < best.module)) best = {m, module, words};
  }
  return best;
}
function overallMastery(){
  let total = 0, count = 0;
  for(const [module, words] of allModules()){
    for(const [eng, tur] of words){
      for(const dir of DIRS) total += computeMastery(historyOf(module, eng, tur, dir));
      count += 2;
    }
  }
  return count ? total / count : 0;
}

/* ===========================================================================
   Recommender -- port of recommenders/weighted.py. Weight each word by
   (1 - mastery) with a floor so mastered words still resurface.
   =========================================================================== */
const MIN_WEIGHT = 0.005;
function selectQuestions(words, module, dir, n){
  n = Math.min(n, words.length);
  const weights = words.map(([eng, tur]) =>
    Math.max(1 - computeMastery(historyOf(module, eng, tur, dir)), MIN_WEIGHT));
  const pool = words.map((_, i) => i);
  const picked = [];
  for(let k = 0; k < n && pool.length; k++){
    let total = 0;
    for(const i of pool) total += weights[i];
    let r = Math.random() * total, cum = 0;
    for(let p = 0; p < pool.length; p++){
      cum += weights[pool[p]];
      if(cum >= r){ picked.push(pool[p]); pool.splice(p, 1); break; }
    }
  }
  return picked;
}

/* ===========================================================================
   Distractors -- a question is the answer, 2 competitive near-misses and the
   rest random, so the six buttons discriminate without becoming predictable.
   =========================================================================== */
const COMPETITIVE = 2;   // near-misses per question
const NEAR_POOL = 8;     // how many of the closest words those 2 are drawn from

const FOLD = {"ı":"i","İ":"i","I":"i","ş":"s","Ş":"s","ğ":"g","Ğ":"g","ç":"c","Ç":"c",
              "ö":"o","Ö":"o","ü":"u","Ü":"u","â":"a","Â":"a","î":"i","Î":"i","û":"u","Û":"u"};
/* Fold Turkish letters before lowercasing -- "İ".toLowerCase() grows a combining dot. */
function fold(s){
  return String(s).replace(/[ıİIşŞğĞçÇöÖüÜâÂîÎûÛ]/g, c => FOLD[c] || c)
                  .toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function levenshtein(a, b){
  if(a === b) return 0;
  if(!a.length || !b.length) return Math.max(a.length, b.length);
  let prev = Array.from({length:b.length + 1}, (_, i) => i);
  for(let i = 1; i <= a.length; i++){
    const cur = [i];
    for(let j = 1; j <= b.length; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

/* How easily two words could be mistaken for each other: edit distance, with a
   push for a shared opening (kapı/kapalı) and for matching length. */
function similarity(a, b){
  const x = fold(a), y = fold(b);
  if(!x || !y || x === y) return 0;
  const max = Math.max(x.length, y.length);
  let sim = 1 - levenshtein(x, y) / max;
  let p = 0;
  while(p < x.length && p < y.length && x[p] === y[p]) p++;
  sim += 0.18 * (p / max);
  if(Math.abs(x.length - y.length) <= 1) sim += 0.06;
  return sim;
}

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildChoices(answer, pool, n){
  const others = [...new Set(pool)].filter(a => a !== answer);
  const near = others.map(a => ({a, s:similarity(answer, a)}))
                     .filter(o => o.s > 0.25)
                     .sort((p, q) => q.s - p.s)
                     .slice(0, NEAR_POOL);
  // Draw the near-misses from a shuffled shortlist, not the top 2, so a word
  // doesn't come with the same six buttons every time.
  const picked = shuffle(near).slice(0, COMPETITIVE).map(o => o.a);
  const rest = shuffle(others.filter(a => !picked.includes(a)));
  for(const a of rest){
    if(picked.length >= n - 1) break;
    picked.push(a);
  }
  return shuffle([answer, ...picked.slice(0, n - 1)]);
}

/* ===========================================================================
   Mastery Check -- an audit drawn from modules you've already got to 90%.
   Answers land in each word's real history, so a module can lose its place.
   =========================================================================== */
const CHECK = "Mastery Check";

function qualifyingModules(threshold){
  return allModules().filter(([mod, words]) => moduleMastery(mod, words) >= threshold);
}
function checkPool(threshold){
  const out = [];
  for(const [mod, words] of qualifyingModules(threshold)){
    for(const [eng, tur] of words) out.push({eng, tur, module:mod});
  }
  return out;
}
/* Mean mastery across every word in the qualifying modules, both directions. */
function poolMastery(entries){
  if(!entries.length) return 0;
  let total = 0;
  for(const e of entries){
    for(const dir of DIRS) total += computeMastery(historyOf(e.module, e.eng, e.tur, dir));
  }
  return total / (entries.length * 2);
}

/* ===========================================================================
   State
   =========================================================================== */
const NUM_CHOICES = 6;   // six answers on screen, always -- three per thumb

let stats = loadStats();
let prefs = Object.assign({count:5, autoAdvance:true, threshold:0.8, app:"vocab", ccount:5, scount:5,
                           palette:"iznik", sfx:true, readAnswer:false, quizType:"text",
                           markIrregular:true, vowelGrid:"pairs"}, (() => {
  try{ return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; }catch(e){ return {}; }
})());
function savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){} }

/* Colour themes -- the CSS lives in :root[data-palette]; swatches preview the
   light-mode accent, data colour and tint. */
const PALETTES = [
  {id:"iznik",   name:"İznik",   en:"tile blue",   swatch:["#17539B", "#1A8F8A", "#DEE8F6"]},
  {id:"nar",     name:"Nar",     en:"pomegranate", swatch:["#830000", "#015E49", "#F2DEDA"]},
  {id:"zumrut",  name:"Zümrüt",  en:"emerald",     swatch:["#015E49", "#8B663D", "#D6E9E3"]},
  {id:"lavanta", name:"Lavanta", en:"lavender",    swatch:["#45457A", "#3E8A8A", "#C2C2E1"]},
  {id:"kahve",   name:"Kahve",   en:"coffee",      swatch:["#8B663D", "#015E49", "#EADFD1"]},

/* ===========================================================================
   Sound -- answer effects from web/sounds (inlined by build_web.py) and the
   device's own Turkish voice for reading aloud. iOS plays nothing until the
   user has tapped, so both unlock on the first interaction.
   =========================================================================== */
const SOUND_DATA = (() => {
  try{ return JSON.parse(document.getElementById("sound-data").textContent) || {}; }catch(e){ return {}; }
})();
const SPEAKER_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;

const Speech = {
  voice: null,
  available: () => typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined",
  pickVoice(){
    if(!this.available()) return;
    const turkish = speechSynthesis.getVoices().filter(v => /^tr([-_]|$)/i.test(v.lang));
    // Prefer a downloaded Enhanced / Premium voice when the device has one.
    this.voice = turkish.find(v => /enhanced|premium|neural/i.test(v.name)) || turkish[0] || null;
  },
  /* Vocab carries alternatives, blanks and glosses: "Pirinç / Pilav", "Benim adım _____". */
  clean: text => String(text).split("/")[0].replace(/_+/g, " ").replace(/\s*\(.*?\)/g, "").replace(/\s+/g, " ").trim(),
  speak(text, onEnd){
    const done = onEnd || (() => {});
    const line = text ? this.clean(text) : "";
    if(!this.available() || !line){ done(); return; }
    // Safari can drop an utterance queued straight after cancel(), so only
    // cancel when something is actually playing.
    if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(line);
    u.lang = "tr-TR";
    if(this.voice) u.voice = this.voice;
    u.rate = 0.9;
    let finished = false;
    const finish = () => { if(!finished){ finished = true; done(); } };
    u.onend = finish;
    u.onerror = finish;
    setTimeout(finish, 1500 + 110 * line.length);   // some iOS builds never fire onend
    speechSynthesis.speak(u);
  },
  stop(){ if(this.available() && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel(); },
};
if(Speech.available()){
  Speech.pickVoice();
  if(speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", () => Speech.pickVoice());
}

const Sound = {
  ctx: null,
  buffers: {},
  unlocked: false,
  unlock(){
    if(!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC){
        try{
          this.ctx = new AC();
          for(const [name, b64] of Object.entries(SOUND_DATA)){
            const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
            this.ctx.decodeAudioData(bytes.buffer, buf => { this.buffers[name] = buf; }, () => {});
          }
        }catch(e){ this.ctx = null; }
      }
    }
    if(this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    if(!this.unlocked && Speech.available()){
      // A silent utterance inside the first tap lets later speech start from a timer.
      const u = new SpeechSynthesisUtterance(" ");
      u.volume = 0;
      speechSynthesis.speak(u);
    }
    this.unlocked = true;
  },
  /* Plays an effect and returns its length in seconds (0 when silent). */
  play(name){
    if(!prefs.sfx || !SOUND_DATA[name]) return 0;
    this.unlock();
    const buf = this.buffers[name];
    if(this.ctx && buf){
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(this.ctx.destination);
      src.start();
      return buf.duration;
    }
    if(typeof Audio !== "undefined"){
      try{ new Audio("data:audio/mpeg;base64," + SOUND_DATA[name]).play().catch(() => {}); }catch(e){}
      return 0.6;
    }
    return 0;
  },
};

/* After an answer: the effect, then the Turkish read aloud if that's on, then
   next() -- never sooner than minMs, so auto-advance doesn't talk over itself. */
function answerFeedback(correct, turkish, minMs, next){
  const started = Date.now();
  const effect = Sound.play(correct ? "correct" : "wrong");
  const after = () => { if(next) setTimeout(next, Math.max(0, minMs - (Date.now() - started))); };
  if(prefs.readAnswer && turkish && Speech.available()){
    setTimeout(() => Speech.speak(turkish, after), Math.min(effect, 1.2) * 1000);
  }else after();
}

/* Dimmed until there's Turkish that won't give the answer away. */
function speakButton(text, big){
  if(!Speech.available()) return "";

    : `<button class="${cls}" disabled aria-label="Answer first to hear it">${SPEAKER_ICON}</button>`;
}

const pct = v => Math.round(v * 100);

function bar(v){ return `<div class="bar"><i style="width:${Math.max(pct(v),0)}%"></i></div>`; }

/* The ten weighted slots of compute_mastery(), widest = most recent answer. */
function meter(history){
  let out = '<span class="meter">';
  for(let i = 0; i < WINDOW; i++){
    const h = history.length - 1 - i;
    const cls = h < 0 ? "" : (history[h] ? "y" : "n");
    out += `<i class="${cls}" style="flex:${MASTERY_WEIGHTS[i]}"></i>`;
  }
  return out + "</span>";
}

/* Total mastery as one bar, with this round's movement picked out:
   a gain is green appended to the old level, a loss is red beyond the new one. */
function deltaBar(mastery, delta){
  const d = delta || 0;
  const base = d > 0 ? Math.max(mastery - d, 0) : mastery;
  return `<span class="dbar"><i class="base" style="width:${pct(base)}%"></i>` +
         `<i class="${d > 0 ? "up" : "down"}" style="width:${pct(Math.abs(d))}%"></i></span>`;
}

/* Both readings stacked: the ten weighted answers, then the resulting total. */
function wordBars(history, delta){
  return meter(history) + deltaBar(computeMastery(history), delta);
}

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);

function startQuiz(){
  // Listening is always hear the Turkish, pick the English.
  const listen = view.quizType === "listen" && Speech.available();
  if(listen) view.dir = "tr_to_en";
  let entries, pool;
  if(view.mode === "check"){
    // An audit: sample the qualifying vocabulary evenly rather than leaning on
    // the weakest words, and freeze the pool so the snapshot compares like with like.
    pool = checkPool(view.threshold);
    view.checkPool = pool;
    entries = shuffle(pool.slice()).slice(0, Math.min(view.count, pool.length));
  }else{
    pool = view.words.map(([eng, tur]) => ({eng, tur, module:view.module}));
    entries = selectQuestions(view.words, view.module, view.dir, view.count)
      .map(i => ({eng:view.words[i][0], tur:view.words[i][1], module:view.module}));
  }

  let answers = pool.map(e => view.dir === "en_to_tr" ? e.tur : e.eng);
  // A small module (My words, early on) borrows wrong answers from everything
  // else, so there are still six buttons.
  if(new Set(answers).size < NUM_CHOICES){
    const side = view.dir === "en_to_tr" ? 1 : 0;
    answers = answers.concat(allModules().flatMap(([, words]) => words.map(w => w[side])));
  }
  const nChoices = Math.min(NUM_CHOICES, new Set(answers).size);
  const questions = entries.map(e => {
    const prompt = view.dir === "en_to_tr" ? e.eng : e.tur;
    const answer = view.dir === "en_to_tr" ? e.tur : e.eng;
    return {
      eng:e.eng, tur:e.tur, module:e.module, prompt, answer,
      choices: buildChoices(answer, answers, nChoices),
      before: computeMastery(historyOf(e.module, e.eng, e.tur, view.dir))
    };
  });
  if(!questions.length){ toast("There's nothing to ask here yet."); go("home"); return; }
  view.quiz = {questions, i:0, score:0, results:[], picked:null, listen};
  view.screen = "quiz";
  render();
  if(listen) Speech.speak(questions[0].tur);
}

  const q = view.quiz, cur = q.questions[q.i];
  const answered = q.picked !== null;
  const right = answered && q.picked === cur.answer;
  app.innerHTML = `

      <button class="back" data-act="abandon">✕</button>

function answerQuiz(choice){
  const q = view.quiz;
  if(q.picked !== null) return;
  const cur = q.questions[q.i];
  const correct = choice === cur.answer;
  q.picked = choice;
  if(correct) q.score += 1;
  // Always recorded against the word's own module, so a Mastery Check moves the
  // mastery of whichever module the word actually belongs to.
  recordAnswer(cur.module, cur.eng, cur.tur, view.dir, correct);
  q.results.push({eng:cur.eng, tur:cur.tur, module:cur.module, correct, before:cur.before});
  saveStats();
  render();
  // Read the Turkish side whichever way round the question was asked.
  const at = q.i;
  answerFeedback(correct, cur.tur, 750, correct && prefs.autoAdvance
    ? () => { if(view.quiz === q && q.i === at && q.picked !== null) nextQuestion(); }
    : null);
}

function nextQuestion(){
  const q = view.quiz;
  if(!q || q.picked === null) return;
  Speech.stop();
  q.picked = null;
  if(q.i + 1 < q.questions.length){
    q.i += 1;
    render();
    if(q.listen) Speech.speak(q.questions[q.i].tur);
    return;
  }
  const label = view.mode === "check" ? CHECK : view.module;
  const snapshot = view.mode === "check"
    ? poolMastery(view.checkPool || [])
    : moduleMastery(view.module, view.words);
  recordSession(label, view.dir, q.score, q.questions.length, snapshot);
  if(q.listen) stats.session_history[stats.session_history.length - 1].listening = true;
  saveStats();
  view.sitting.push({module: q.listen ? `${label} · listening` : label, direction:view.dir,
                     score:q.score, total:q.questions.length});
  saveSitting();
  view.last = q;
  view.quiz = null;
  view.screen = "results";
  render();
}
