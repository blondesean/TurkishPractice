<html lang="en">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Türkçe">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#0C1624" media="(prefers-color-scheme: dark)">

<title>Türkçe Practice</title>
<style>
/* ---------------------------------------------------------------------------
   İznik palette: Ottoman tile cobalt + turquoise + Armenian bole red, on cool
   blue-biased paper. Every colour is declared here in the bare :root first so
   the un-stamped (system-theme) document always resolves.
--------------------------------------------------------------------------- */
:root{
  --paper:#E9EDF2;
  --surface:#FFFFFF;
  --sunken:#F1F4F8;
  --line:#D2DAE4;
  --line-soft:#E2E8EF;
  --ink:#132A42;
  --muted:#5C7288;
  --faint:#8496A8;
  --cobalt:#17539B;
  --cobalt-ink:#FFFFFF;
  --cobalt-wash:#DEE8F6;
  --turquoise:#1A8F8A;
  --bole:#BC3E2C;
  --good:#1A7F5E;
  --good-wash:#DCEFE7;
  --bad:#BC3E2C;
  --bad-wash:#F6E1DD;
  --gold:#A8762A;
  --plum:#7A4A86;
  --shadow:0 1px 2px rgba(19,42,66,.06), 0 6px 20px -12px rgba(19,42,66,.28);
  --r:14px;
  --sans:"Karla", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1624;
    --surface:#14212F;
    --sunken:#1A2939;
    --line:#27394E;
    --line-soft:#1F3043;
    --ink:#E2EAF3;
    --muted:#8CA2B9;
    --faint:#6B8199;
    --cobalt:#6AA8E6;
    --cobalt-ink:#06121F;
    --cobalt-wash:#1A3149;
    --turquoise:#3FC2BA;
    --bole:#E4715D;
    --good:#3DB88C;
    --good-wash:#14332A;
    --bad:#E4715D;
    --bad-wash:#37201C;
    --gold:#D8A441;
    --plum:#B98ACB;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0C1624;
  --surface:#14212F;
  --sunken:#1A2939;
  --line:#27394E;
  --line-soft:#1F3043;
  --ink:#E2EAF3;
  --muted:#8CA2B9;
  --faint:#6B8199;
  --cobalt:#6AA8E6;
  --cobalt-ink:#06121F;
  --cobalt-wash:#1A3149;
  --turquoise:#3FC2BA;
  --bole:#E4715D;
  --good:#3DB88C;
  --good-wash:#14332A;
  --bad:#E4715D;
  --bad-wash:#37201C;
  --gold:#D8A441;
  --plum:#B98ACB;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:6px}

#app{
  max-width:640px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
          max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  gap:14px;
}

/* --- shared bits ------------------------------------------------------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
.topbar{display:flex;align-items:center;gap:12px;min-height:34px}
.topbar .grow{flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);
  font-size:14px;font-weight:600;padding:6px 10px 6px 4px;margin-left:-4px}
.back:hover{color:var(--cobalt)}
.screen-title{font-family:var(--serif);font-size:26px;font-weight:600;
  line-height:1.1;letter-spacing:-.01em;text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.sheet{background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r);box-shadow:var(--shadow)}

/* --- home -------------------------------------------------------------- */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.masthead h1{font-family:var(--serif);font-size:34px;font-weight:600;margin:2px 0 0;
  line-height:1;letter-spacing:-.02em}
.overall{text-align:right;flex:none}
.overall b{font-family:var(--mono);font-size:24px;font-weight:600;display:block;
  line-height:1.1;color:var(--cobalt)}

.rows{display:flex;flex-direction:column;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);padding:13px 14px;transition:background .12s}
.row:hover{background:var(--sunken)}
.row .label{flex:1;min-width:0}
.row .name{font-weight:600;font-size:15px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12.5px;color:var(--faint)}
.row .pct{font-family:var(--mono);font-size:14px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--muted);flex:none;width:38px;text-align:right}
.row .chev{color:var(--faint);flex:none;font-size:15px}

.bar{height:5px;border-radius:99px;background:var(--sunken);overflow:hidden;
  margin-top:6px;border:1px solid var(--line-soft)}
.bar i{display:block;height:100%;background:var(--turquoise);border-radius:99px}

.suggest{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:14px;border-radius:var(--r);background:var(--cobalt-wash);
  border:1px solid transparent}
.suggest:hover{border-color:var(--cobalt)}
.suggest .mark{width:34px;height:34px;flex:none;border-radius:9px;background:var(--cobalt);
  color:var(--cobalt-ink);display:grid;place-items:center;font-family:var(--serif);
  font-size:18px;font-weight:700}
.suggest .name{font-weight:700;font-size:15.5px;display:block}
.suggest .sub{font-size:12.5px;color:var(--muted)}
.suggest .pct{font-family:var(--mono);font-weight:600;color:var(--cobalt);flex:none}
.suggest.check{background:transparent;border-color:var(--line)}
.suggest.check:hover{border-color:var(--turquoise)}
.suggest.check .mark{background:var(--turquoise);color:var(--surface)}
.suggest.check .pct{color:var(--turquoise)}

.search{width:100%;font-family:var(--sans);font-size:16px;padding:14px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search::placeholder{color:var(--faint)}
.hit{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface)}
.hit .w{flex:1;min-width:0}
.hit .w b{font-weight:600;font-size:15px}
.hit .w span{color:var(--faint);font-size:13.5px}
.hit .w .mod{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.04em;margin-top:2px}
.hit .dirs{flex:none;display:flex;gap:10px;text-align:right}
.hit .dirs div{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.hit .dirs small{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.06em}

/* --- setup ------------------------------------------------------------- */
.field{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:6px;background:var(--sunken);padding:5px;border-radius:12px;
  border:1px solid var(--line-soft)}
.seg button{flex:1;padding:11px 8px;border-radius:8px;font-size:14.5px;font-weight:600;
  color:var(--muted);text-align:center;transition:background .12s,color .12s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 2px rgba(19,42,66,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:10px 16px;border-radius:99px;border:1px solid var(--line);
  font-family:var(--mono);font-size:14px;font-weight:500;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);
  border-color:var(--ink)}
.primary{display:block;width:100%;padding:16px;border-radius:12px;background:var(--cobalt);
  color:var(--cobalt-ink);font-size:16px;font-weight:700;letter-spacing:.01em;
  text-align:center;box-shadow:var(--shadow)}
.primary:hover{filter:brightness(1.08)}
.ghost{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);
  font-size:15px;font-weight:600;color:var(--muted);text-align:center}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

/* --- quiz -------------------------------------------------------------- */
.pips{display:flex;gap:4px;flex:1}
.pips i{height:4px;flex:1;border-radius:99px;background:var(--line)}
.pips i.ok{background:var(--good)}
.pips i.no{background:var(--bad)}
.pips i.now{background:var(--cobalt)}

.prompt{padding:26px 20px;text-align:center;display:flex;flex-direction:column;
  gap:10px;align-items:center}
.prompt .ask{font-size:13px;color:var(--faint);font-weight:500}
.prompt .word{font-family:var(--serif);font-size:clamp(30px,8.5vw,46px);font-weight:600;
  line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
/* Always two columns: three answers under the left thumb, three under the right. */
.choices{display:grid;gap:8px;grid-template-columns:1fr 1fr;align-items:stretch}
.choice{display:flex;align-items:center;gap:9px;padding:13px 11px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);text-align:left;font-size:15.5px;
  font-weight:500;min-height:64px;transition:border-color .12s, background .12s}
.choice:hover:not(:disabled){border-color:var(--cobalt)}
.choice .k{font-family:var(--mono);font-size:12px;color:var(--faint);flex:none;
  width:20px;height:20px;border-radius:5px;background:var(--sunken);display:grid;
  place-items:center;font-weight:500}
.choice .t{flex:1;min-width:0;overflow-wrap:anywhere}
.choice.right{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.choice.right .k{background:var(--good);color:var(--surface)}
.choice.wrong{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.choice.wrong .k{background:var(--bad);color:var(--surface)}
.choice:disabled{cursor:default}
.choice.dim{opacity:.42}

.verdict{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 15px;border-radius:12px;font-weight:600;font-size:15px}
.verdict.right{background:var(--good-wash);color:var(--good)}
.verdict.wrong{background:var(--bad-wash);color:var(--bad)}
.verdict button{font-weight:700;font-size:14px;text-decoration:underline;
  text-underline-offset:3px}

/* --- results ----------------------------------------------------------- */
.score{display:flex;align-items:center;gap:18px;padding:18px}
.score .big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;
  letter-spacing:-.03em}
.score .big small{font-size:22px;color:var(--faint);font-weight:400}
.score .say{font-size:14.5px;color:var(--muted);flex:1}

.wordrow{display:flex;align-items:center;gap:11px;padding:11px 14px;background:var(--surface)}
.wordrow .tick{width:18px;flex:none;font-weight:700;font-family:var(--mono);font-size:14px}
.wordrow .pair{flex:1;min-width:0;font-size:14.5px}
.wordrow .pair b{font-weight:600}
.wordrow .pair span{color:var(--faint)}
.wordrow .delta{font-family:var(--mono);font-size:12.5px;font-weight:500;flex:none;
  font-variant-numeric:tabular-nums}
.wordrow .from{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.04em;margin-top:2px}

/* the 10 weighted slots of compute_mastery(), most recent on the left */
.meter{display:flex;gap:2px;height:8px;margin-top:5px}
.meter i{border-radius:2px;background:var(--line)}
.meter i.y{background:var(--turquoise)}
.meter i.n{background:var(--bole)}

/* render_mastery_change(): grey base bar with this round's gain/loss overlaid */
.dbar{display:flex;height:7px;margin-top:3px;border-radius:99px;overflow:hidden;
  background:var(--sunken);border:1px solid var(--line-soft)}
.dbar i{display:block;height:100%}
.dbar .base{background:var(--muted)}
.dbar .up{background:var(--good)}
.dbar .down{background:var(--bad)}

.chart{padding:14px 14px 10px}
.chart h3{font-size:13px;font-weight:700;margin:0 0 2px;letter-spacing:.01em}
.chart p{font-size:12px;color:var(--faint);margin:0 0 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px;
  flex-wrap:wrap}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* --- data screen ------------------------------------------------------- */
select{width:100%;font-family:var(--sans);font-size:16px;font-weight:600;padding:13px 12px;
  border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
  linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 19px) 21px, calc(100% - 14px) 21px;
  background-size:5px 5px, 5px 5px;background-repeat:no-repeat}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:13px;
  padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--sunken);
  color:var(--ink);resize:vertical}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.note code{font-family:var(--mono);font-size:12px;background:var(--sunken);
  padding:1px 5px;border-radius:4px}
.stack{display:flex;flex-direction:column;gap:10px;padding:14px}
.split{display:flex;gap:9px}
.split>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;
  border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:9}
.foot{margin-top:auto;padding-top:6px;display:flex;justify-content:center;gap:18px}
.foot button{font-size:13px;color:var(--faint);font-weight:600}
.foot button:hover{color:var(--cobalt)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
"use strict";

/* ===========================================================================
   Mastery -- a direct port of mastery.py. Keep the weights in sync with it.
   =========================================================================== */
const MASTERY_WEIGHTS = [0.30, 0.25, 0.20, 0.10, 0.05, 0.02, 0.02, 0.02, 0.02, 0.02];
const WINDOW = MASTERY_WEIGHTS.length;

function computeMastery(history){
  if(!history || !history.length) return 0;
  const recent = history.slice(-WINDOW);
  let score = 0;
  for(let i = 0; i < recent.length; i++){
    if(recent[recent.length - 1 - i]) score += MASTERY_WEIGHTS[i];
  }
  return score;
}

  }catch(e){ /* private mode, blocked storage -- run from memory */ }
  return emptyStats();
}
function saveStats(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(stats)); }catch(e){}
}
function normalize(s){
  s.words = s.words || {};
  s.modules = s.modules || {};
  s.sessions = s.sessions || 0;
  s.session_history = s.session_history || [];
  // Mirror _migrate_module_names(), but only for the all-lowercase legacy names
  // it was written for -- title-casing a name that already has capitals risks
  // mangling Turkish dotted capitals (İ) and breaking the word key.
  const fix = m => (m === m.toLowerCase()
    ? m.replace(/([a-zçğıöşü])([a-zçğıöşü]*)/gi, (_, a, b) => a.toUpperCase() + b)
    : m);
  const words = {};
  for(const [key, w] of Object.entries(s.words)){
    const nm = fix(w.module);
    if(nm !== w.module){
      words[key.replace(w.module + "|", nm + "|")] = Object.assign(w, {module:nm});
    } else words[key] = w;
  }
  s.words = words;
  const mods = {};
  for(const [m, d] of Object.entries(s.modules)){
    const nm = fix(m);
    if(mods[nm]){
      for(const dir of DIRS){
        mods[nm][dir].asked += d[dir].asked;
        mods[nm][dir].correct += d[dir].correct;
      }
      mods[nm].sessions += d.sessions;
    } else mods[nm] = d;
  }
  s.modules = mods;
  for(const e of s.session_history) e.module = fix(e.module);
  return s;
}

const wordKey = (module, eng, tur) => `${module}|${eng}|${tur}`;

/* datetime.now().isoformat() -- local time, no timezone suffix, as Python writes it */
function localISO(){
  const d = new Date(), p = (n, w = 2) => String(n).padStart(w, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T` +
         `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.` +
         `${p(d.getMilliseconds(),3)}000`;
}

function historyOf(module, eng, tur, dir){
  const w = stats.words[wordKey(module, eng, tur)];
  return (w && w[dir] && w[dir].history) || [];
}

function recordAnswer(module, eng, tur, dir, correct){
  const key = wordKey(module, eng, tur);
  if(!stats.words[key]){
    stats.words[key] = {
      module, english:eng, turkish:tur,
      en_to_tr:{seen:0, correct:0, history:[]},
      tr_to_en:{seen:0, correct:0, history:[]},
      last_seen:null
    };
  }
  const w = stats.words[key];
  if(!w[dir].history) w[dir].history = [];
  w[dir].seen += 1;
  if(correct) w[dir].correct += 1;
  w[dir].history.push(correct);
  w.last_seen = localISO();
}

/* `snapshot` is the mastery figure stored with the session: mean module mastery
   for a normal round, mean mastery of the qualifying pool for a Mastery Check. */
function recordSession(module, dir, score, total, snapshot){
  if(!stats.modules[module]){
    stats.modules[module] = {sessions:0, en_to_tr:{asked:0,correct:0}, tr_to_en:{asked:0,correct:0}};
  }
  const m = stats.modules[module];
  m.sessions += 1;
  m[dir].asked += total;
  m[dir].correct += score;
  stats.sessions += 1;
  stats.session_history.push({
    timestamp: localISO(), module, direction:dir, score, total,
    mastery: snapshot
  });
}

/* --- aggregates ---------------------------------------------------------- */
function moduleMastery(module, words){
  if(!words || !words.length) return 0;
  let total = 0;
  for(const [eng, tur] of words){
    for(const dir of DIRS) total += computeMastery(historyOf(module, eng, tur, dir));
  }
  return total / (words.length * 2);
}
function categoryMastery(cat){
  const subs = VOCAB[cat];
  let total = 0, count = 0;
  for(const [sub, words] of Object.entries(subs)){
    const module = moduleName(cat, sub);
    for(const [eng, tur] of words){
      for(const dir of DIRS) total += computeMastery(historyOf(module, eng, tur, dir));
      count += 2;
    }
  }
  return count ? total / count : 0;
}
/* Categories whose only focus is "Main" flatten to the category name. */
const isFlat = cat => {const k = Object.keys(VOCAB[cat]); return k.length === 1 && k[0] === "Main";};
const moduleName = (cat, sub) => isFlat(cat) ? cat : `${cat}/${sub}`;
const wordsOf = (cat, sub) => VOCAB[cat][sub];
const countWords = cat => Object.values(VOCAB[cat]).reduce((n, w) => n + w.length, 0);

function allModules(){
  const out = [];
  for(const cat of Object.keys(VOCAB)){
    for(const sub of Object.keys(VOCAB[cat])) out.push([moduleName(cat, sub), wordsOf(cat, sub)]);
  }
  return out;
}
function lowestMasteryModule(){
  let best = null;
  for(const [module, words] of allModules()){
    const m = moduleMastery(module, words);
    if(!best || m < best.m || (m === best.m && module < best.module)) best = {m, module, words};
  }
  return best;
}
function overallMastery(){
  let total = 0, count = 0;
  for(const [module, words] of allModules()){
    for(const [eng, tur] of words){
      for(const dir of DIRS) total += computeMastery(historyOf(module, eng, tur, dir));
      count += 2;
    }
  }
  return count ? total / count : 0;
}

/* ===========================================================================
   Recommender -- port of recommenders/weighted.py. Weight each word by
   (1 - mastery) with a floor so mastered words still resurface.
   =========================================================================== */
const MIN_WEIGHT = 0.005;
function selectQuestions(words, module, dir, n){
  n = Math.min(n, words.length);
  const weights = words.map(([eng, tur]) =>
    Math.max(1 - computeMastery(historyOf(module, eng, tur, dir)), MIN_WEIGHT));
  const pool = words.map((_, i) => i);
  const picked = [];
  for(let k = 0; k < n && pool.length; k++){
    let total = 0;
    for(const i of pool) total += weights[i];
    let r = Math.random() * total, cum = 0;
    for(let p = 0; p < pool.length; p++){
      cum += weights[pool[p]];
      if(cum >= r){ picked.push(pool[p]); pool.splice(p, 1); break; }
    }
  }
  return picked;
}

/* ===========================================================================
   Distractors -- a question is the answer, 2 competitive near-misses and the
   rest random, so the six buttons discriminate without becoming predictable.
   =========================================================================== */
const COMPETITIVE = 2;   // near-misses per question
const NEAR_POOL = 8;     // how many of the closest words those 2 are drawn from

const FOLD = {"ı":"i","İ":"i","I":"i","ş":"s","Ş":"s","ğ":"g","Ğ":"g","ç":"c","Ç":"c",
              "ö":"o","Ö":"o","ü":"u","Ü":"u","â":"a","Â":"a","î":"i","Î":"i","û":"u","Û":"u"};
/* Fold Turkish letters before lowercasing -- "İ".toLowerCase() grows a combining dot. */
function fold(s){
  return String(s).replace(/[ıİIşŞğĞçÇöÖüÜâÂîÎûÛ]/g, c => FOLD[c] || c)
                  .toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function levenshtein(a, b){
  if(a === b) return 0;
  if(!a.length || !b.length) return Math.max(a.length, b.length);
  let prev = Array.from({length:b.length + 1}, (_, i) => i);
  for(let i = 1; i <= a.length; i++){
    const cur = [i];
    for(let j = 1; j <= b.length; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

/* How easily two words could be mistaken for each other: edit distance, with a
   push for a shared opening (kapı/kapalı) and for matching length. */
function similarity(a, b){
  const x = fold(a), y = fold(b);
  if(!x || !y || x === y) return 0;
  const max = Math.max(x.length, y.length);
  let sim = 1 - levenshtein(x, y) / max;
  let p = 0;
  while(p < x.length && p < y.length && x[p] === y[p]) p++;
  sim += 0.18 * (p / max);
  if(Math.abs(x.length - y.length) <= 1) sim += 0.06;
  return sim;
}

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildChoices(answer, pool, n){
  const others = [...new Set(pool)].filter(a => a !== answer);
  const near = others.map(a => ({a, s:similarity(answer, a)}))
                     .filter(o => o.s > 0.25)
                     .sort((p, q) => q.s - p.s)
                     .slice(0, NEAR_POOL);
  // Draw the near-misses from a shuffled shortlist, not the top 2, so a word
  // doesn't come with the same six buttons every time.
  const picked = shuffle(near).slice(0, COMPETITIVE).map(o => o.a);
  const rest = shuffle(others.filter(a => !picked.includes(a)));
  for(const a of rest){
    if(picked.length >= n - 1) break;
    picked.push(a);
  }
  return shuffle([answer, ...picked.slice(0, n - 1)]);
}

/* ===========================================================================
   Mastery Check -- an audit drawn from modules you've already got to 90%.
   Answers land in each word's real history, so a module can lose its place.
   =========================================================================== */
const CHECK = "Mastery Check";

function qualifyingModules(threshold){
  return allModules().filter(([mod, words]) => moduleMastery(mod, words) >= threshold);
}
function checkPool(threshold){
  const out = [];
  for(const [mod, words] of qualifyingModules(threshold)){
    for(const [eng, tur] of words) out.push({eng, tur, module:mod});
  }
  return out;
}
/* Mean mastery across every word in the qualifying modules, both directions. */
function poolMastery(entries){
  if(!entries.length) return 0;
  let total = 0;
  for(const e of entries){
    for(const dir of DIRS) total += computeMastery(historyOf(e.module, e.eng, e.tur, dir));
  }
  return total / (entries.length * 2);
}

const pct = v => Math.round(v * 100);

function bar(v){ return `<div class="bar"><i style="width:${Math.max(pct(v),0)}%"></i></div>`; }

/* The ten weighted slots of compute_mastery(), widest = most recent answer. */
function meter(history){
  let out = '<span class="meter">';
  for(let i = 0; i < WINDOW; i++){
    const h = history.length - 1 - i;
    const cls = h < 0 ? "" : (history[h] ? "y" : "n");
    out += `<i class="${cls}" style="flex:${MASTERY_WEIGHTS[i]}"></i>`;
  }
  return out + "</span>";
}

/* Total mastery as one bar, with this round's movement picked out:
   a gain is green appended to the old level, a loss is red beyond the new one. */
function deltaBar(mastery, delta){
  const d = delta || 0;
  const base = d > 0 ? Math.max(mastery - d, 0) : mastery;
  return `<span class="dbar"><i class="base" style="width:${pct(base)}%"></i>` +
         `<i class="${d > 0 ? "up" : "down"}" style="width:${pct(Math.abs(d))}%"></i></span>`;
}

/* Both readings stacked: the ten weighted answers, then the resulting total. */
function wordBars(history, delta){
  return meter(history) + deltaBar(computeMastery(history), delta);
}

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1900);
}

function startQuiz(){
  let entries, pool;
  if(view.mode === "check"){
    // An audit: sample the qualifying vocabulary evenly rather than leaning on
    // the weakest words, and freeze the pool so the snapshot compares like with like.
    pool = checkPool(view.threshold);
    view.checkPool = pool;
    entries = shuffle(pool.slice()).slice(0, Math.min(view.count, pool.length));
  }else{
    pool = view.words.map(([eng, tur]) => ({eng, tur, module:view.module}));
    entries = selectQuestions(view.words, view.module, view.dir, view.count)
      .map(i => ({eng:view.words[i][0], tur:view.words[i][1], module:view.module}));
  }

  const answers = pool.map(e => view.dir === "en_to_tr" ? e.tur : e.eng);
  const nChoices = Math.min(NUM_CHOICES, new Set(answers).size);
  const questions = entries.map(e => {
    const prompt = view.dir === "en_to_tr" ? e.eng : e.tur;
    const answer = view.dir === "en_to_tr" ? e.tur : e.eng;
    return {
      eng:e.eng, tur:e.tur, module:e.module, prompt, answer,
      choices: buildChoices(answer, answers, nChoices),
      before: computeMastery(historyOf(e.module, e.eng, e.tur, view.dir))
    };
  });
  view.quiz = {questions, i:0, score:0, results:[], picked:null};
  view.screen = "quiz";
  render();
}

  const q = view.quiz, cur = q.questions[q.i];

    <div class="topbar">
      <button class="back" data-act="abandon">✕</button>
      <div class="pips">
        ${q.questions.map((_, i) => {

          return `<i class="${i === q.i ? "now" : ""}"></i>`;
        }).join("")}
      </div>
      <span class="num eyebrow">${q.i + 1}/${q.questions.length}</span>
    </div>

    <div class="sheet prompt">
      <span class="ask">${view.dir === "en_to_tr" ? "How do you say" : "What does this mean"}</span>

    </div>` : ""}`;
}

function answerQuiz(choice){
  const q = view.quiz;
  if(q.picked !== null) return;
  const cur = q.questions[q.i];
  const correct = choice === cur.answer;
  q.picked = choice;
  if(correct) q.score += 1;
  // Always recorded against the word's own module, so a Mastery Check moves the
  // mastery of whichever module the word actually belongs to.
  recordAnswer(cur.module, cur.eng, cur.tur, view.dir, correct);
  q.results.push({eng:cur.eng, tur:cur.tur, module:cur.module, correct, before:cur.before});
  saveStats();
  render();
  if(correct && prefs.autoAdvance) setTimeout(() => { if(view.quiz === q && q.picked !== null) nextQuestion(); }, 750);
}

function nextQuestion(){
  const q = view.quiz;
  if(q.picked === null) return;
  q.picked = null;
  if(q.i + 1 < q.questions.length){ q.i += 1; render(); return; }
  const label = view.mode === "check" ? CHECK : view.module;
  const snapshot = view.mode === "check"
    ? poolMastery(view.checkPool || [])
    : moduleMastery(view.module, view.words);
  recordSession(label, view.dir, q.score, q.questions.length, snapshot);
  saveStats();
  view.sitting.push({module:label, direction:view.dir, score:q.score, total:q.questions.length});
  saveSitting();
  view.last = q;
  view.quiz = null;
  view.screen = "results";
  render();
}

/* --- charts -------------------------------------------------------------- */
/* Rotating per-module colours, mirroring MODULE_COLORS in graphs.py */
const MODULE_COLORS = ["var(--cobalt)", "var(--turquoise)", "var(--bole)",
                       "var(--good)", "var(--gold)", "var(--plum)"];

function lineChart(series, labels){
  const W = 320, H = 96, L = 26, R = 6, T = 8, B = 16;
  const n = Math.max(...series.map(s => s.points.length));
  if(n < 1) return "";
  const x = i => n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1);
  const y = v => T + (1 - v) * (H - T - B);
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(const g of [0, 0.5, 1]){
    out += `<line x1="${L}" y1="${y(g)}" x2="${W - R}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/>` +
           `<text x="${L - 5}" y="${y(g) + 3.5}" text-anchor="end" fill="var(--faint)" ` +
           `font-family="var(--mono)" font-size="9">${pct(g)}</text>`;
  }
  for(const s of series){
    let d = "", open = false;
    s.points.forEach((v, i) => {
      if(v === null || v === undefined){ open = false; return; }   // gap, as in _render_line_chart
      d += (open ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " ";
      open = true;
    });
    if(d && !s.noLine) out += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"
             stroke-linejoin="round" stroke-linecap="round"/>`;
    const dots = s.dots || [];
    s.points.forEach((v, i) => {
      if(v === null || v === undefined) return;
      const last = i === s.points.length - 1;
      if(!last && !s.markEvery && n > 14) return;
      out += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${last ? 3.4 : 2.4}"
               fill="${dots[i] || s.color}"/>`;
    });
  }
  if(labels){
    out += `<text x="${L}" y="${H - 3}" fill="var(--faint)" font-family="var(--mono)" font-size="9">${esc(labels[0])}</text>`;
    out += `<text x="${W - R}" y="${H - 3}" text-anchor="end" fill="var(--faint)" font-family="var(--mono)" font-size="9">${esc(labels[1])}</text>`;
  }
  return out + "</svg>";
}

/* render_session_accuracy(): this sitting's rounds, one colour per module. */
function sittingChart(){
  if(!view.sitting.length) return "";
  const mods = [];
  for(const s of view.sitting) if(!mods.includes(s.module)) mods.push(s.module);
  const colorOf = m => MODULE_COLORS[mods.indexOf(m) % MODULE_COLORS.length];
  const pts = view.sitting.map(s => s.total ? s.score / s.total : 0);
  const dots = view.sitting.map(s => colorOf(s.module));
  return `<div class="sheet chart">
    <h3>This sitting</h3>
    <p>${view.sitting.length} round${view.sitting.length === 1 ? "" : "s"} since you opened the app. Resets when you close it.</p>
    ${lineChart([{points:pts, color:"var(--line)", dots, markEvery:true}], ["first", "latest"])}
    <div class="legend">
      ${mods.map(m => `<span><b style="background:${colorOf(m)}"></b>${esc(m)}</span>`).join("")}
    </div>
  </div>`;
}

/* The label a round is filed under: a Mastery Check spans modules. */
function roundLabel(){ return view.mode === "check" ? CHECK : view.module; }

/* Per-round scores for this module, oldest to newest. */
function moduleRoundsChart(){
  const mod = roundLabel();
  const hist = stats.session_history.filter(s => s.module === mod);
  if(!hist.length) return "";
  const pts = hist.map(s => s.total ? s.score / s.total : 0);
  return `<div class="sheet chart">
    <h3>${esc(mod)} over time</h3>
    <p>What you scored in each of the last ${hist.length} round${hist.length === 1 ? "" : "s"} of
       ${view.mode === "check" ? "the check" : "this module"}, both directions.</p>
    ${lineChart([{points:pts, color:"var(--cobalt)"}], [`${hist.length} rounds ago`, "now"])}
  </div>`;
}

/* render_module_progress_over_time(): cumulative test accuracy against the
   mastery snapshot recorded with each session. Sessions logged before snapshots
   existed have no mastery value and leave a gap in the line. */
function cumulativeChart(){
  const mod = roundLabel();
  const hist = stats.session_history.filter(s => s.module === mod);
  if(!hist.length) return "";
  let cumCorrect = 0, cumTotal = 0;
  const acc = [], mast = [];
  for(const s of hist){
    cumCorrect += s.score;
    cumTotal += s.total;
    acc.push(cumTotal > 0 ? cumCorrect / cumTotal : 0);
    mast.push(s.mastery === null || s.mastery === undefined ? null : s.mastery);
  }
  const gaps = mast.some(m => m === null);
  return `<div class="sheet chart">
    <h3>Accuracy against mastery</h3>
    <p>Lifetime accuracy in ${esc(mod)} — every question ever asked — against
       ${view.mode === "check" ? "the mastery of everything the check draws from" : "the module's mastery"}
       at each round.${gaps ? " Gaps are rounds recorded before mastery was tracked." : ""}</p>
    ${lineChart([
      {points:acc, color:"var(--cobalt)"},
      {points:mast, color:"var(--gold)"}
    ], [`${hist.length} rounds ago`, "now"])}
    <div class="legend">
      <span><b style="background:var(--cobalt)"></b>Test accuracy — ${pct(acc[acc.length-1])}%</span>
      <span><b style="background:var(--gold)"></b>Mastery — ${pct(view.mode === "check"
        ? poolMastery(view.checkPool || []) : moduleMastery(view.module, view.words))}%</span>
    </div>
  </div>`;
}

/* render_module_ranking(): every module averaged over both directions, best
   first. Untested word/direction pairs count as 0, so a module can't exceed
   tested/total. Untouched modules are hidden to avoid a wall of zeroes, except
   the one just practised. */
function rankingChart(){
  // Keyed by the word's own module, so a Mastery Check shows a delta against
  // every module it happened to pull from.
  const quizzed = {}, touched = new Set();
  if(view.last) for(const r of view.last.results){
    const k = (r.module || view.module) + "|" + r.eng + "|" + r.tur;
    quizzed[k] = (quizzed[k] || 0) + 1;
    touched.add(r.module || view.module);
  }
  const ranked = [];
  for(const [mod, words] of allModules()){
    if(!words.length) continue;
    const live = touched.has(mod);
    let now = 0, old = 0;
    for(const [eng, tur] of words){
      const hEn = historyOf(mod, eng, tur, "en_to_tr");
      const hTr = historyOf(mod, eng, tur, "tr_to_en");
      const mEn = computeMastery(hEn), mTr = computeMastery(hTr);
      now += mEn + mTr;
      if(live){
        const k = quizzed[mod + "|" + eng + "|" + tur] || 0;
        old += view.dir === "en_to_tr"
          ? computeMastery(k ? hEn.slice(0, -k) : hEn) + mTr
          : mEn + computeMastery(k ? hTr.slice(0, -k) : hTr);
      }
    }
    const denom = words.length * 2;
    const mastery = now / denom;
    if(mastery === 0 && !live) continue;
    ranked.push({mod, mastery, n:words.length, live, delta: live ? mastery - old / denom : null});
  }
  if(!ranked.length) return "";
  ranked.sort((a, b) => b.mastery - a.mastery);

  return `<div class="sheet" style="overflow:hidden">
    <div class="chart" style="padding-bottom:4px">
      <h3>All modules ranked</h3>
      <p>Averaged over both directions. Words you've never been asked count as zero,
         so a module only fills up once you've covered all of it.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:1px;background:var(--line-soft)">
      ${ranked.map((r, i) => {
        const d = r.delta || 0;
        const dc = d > 0 ? "var(--good)" : d < 0 ? "var(--bad)" : "var(--faint)";
        const here = r.live;
        return `<div class="wordrow"${here ? ' style="background:var(--cobalt-wash)"' : ""}>
          <span class="tick" style="color:var(--faint);font-size:12px">${i + 1}</span>
          <span class="pair">
            <b${here ? ' style="color:var(--cobalt)"' : ""}>${esc(r.mod)}</b>
            <span>${r.n} words</span>
            ${deltaBar(r.mastery, d)}
          </span>
          <span class="delta">${pct(r.mastery)}%<br>
            <span style="color:${dc}">${r.delta === null ? "&nbsp;" : (d >= 0 ? "+" : "") + pct(d)}</span></span>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

  app.innerHTML = `
    <div class="topbar"><div class="grow"><span class="eyebrow">${esc(roundLabel())} · ${view.dir === "en_to_tr" ? "EN → TR" : "TR → EN"}</span></div></div>

          check ? " Each answer counts as that word's newest result, so its module moves with it." : ""}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:1px;background:var(--line-soft)">${rows}</div>

/* render_mastery_change(): every word in this module that's been tested in this
   direction, weakest first, with this round's gain or loss overlaid on the bar. */
function weakWords(){
  if(view.mode === "check") return "";   // a check spans modules; "this round" covers it
  const q = view.last;
  const quizzed = {};
  for(const r of q.results){
    const k = r.eng + "|" + r.tur;
    quizzed[k] = (quizzed[k] || 0) + 1;
  }

  const out = [];
  for(const w of Object.values(stats.words)){
    if(w.module !== view.module) continue;
    const h = (w[view.dir] && w[view.dir].history) || [];
    if(!h.length) continue;
    const m = computeMastery(h);
    const seen = quizzed[w.english + "|" + w.turkish] || 0;
    const delta = seen ? m - computeMastery(h.slice(0, -seen)) : null;
    out.push({m, delta, h, eng:w.english, tur:w.turkish, seen:w[view.dir].seen});
  }
  if(!out.length) return "";
  out.sort((a, b) => a.m - b.m || b.seen - a.seen);

  const rows = out.map(w => {
    const d = w.delta || 0;
    const dc = d > 0 ? "var(--good)" : d < 0 ? "var(--bad)" : "var(--faint)";
    return `<div class="wordrow">
      <span class="pair">
        <b>${esc(view.dir === "en_to_tr" ? w.eng : w.tur)}</b>
        <span>${esc(view.dir === "en_to_tr" ? w.tur : w.eng)}</span>
        ${wordBars(w.h, d)}
      </span>
      <span class="delta">${pct(w.m)}%<br>
        <span style="color:${dc}">${w.delta === null ? "&nbsp;" : (d >= 0 ? "+" : "") + pct(d)}</span></span>
    </div>`;
  }).join("");

  return `<div class="sheet" style="overflow:hidden">
    <div class="chart" style="padding-bottom:4px">
      <h3>Weakest words</h3>
      <p>Every ${view.dir === "en_to_tr" ? "English → Türkçe" : "Türkçe → English"} word
         you've been tested on here, weakest first. These come up most often.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:1px;background:var(--line-soft)">${rows}</div>
  </div>`;
}

/* Look up any word in the vocabulary and see where it stands. */
let SEARCH_INDEX = null;
function searchIndex(){
  if(SEARCH_INDEX) return SEARCH_INDEX;
  SEARCH_INDEX = [];
  for(const [mod, words] of allModules()){
    for(const [eng, tur] of words){
      SEARCH_INDEX.push({eng, tur, mod, key:fold(eng) + " " + fold(tur)});
    }
  }
  return SEARCH_INDEX;
}

function searchHits(query){
  const q = fold(query);
  if(!q) return [];
  const hits = searchIndex().filter(w => w.key.includes(q));
  // Whole-word and opening matches first, then alphabetical.
  hits.sort((a, b) => {
    const ra = fold(a.eng) === q || fold(a.tur) === q ? 0
             : fold(a.eng).startsWith(q) || fold(a.tur).startsWith(q) ? 1 : 2;
    const rb = fold(b.eng) === q || fold(b.tur) === q ? 0
             : fold(b.eng).startsWith(q) || fold(b.tur).startsWith(q) ? 1 : 2;
    return ra - rb || a.eng.localeCompare(b.eng);
  });
  return hits;
}

function searchResults(query){
  const hits = searchHits(query);
  if(!query.trim()) return `<p class="note" style="text-align:center">
    ${searchIndex().length} words. Type in either language — accents optional.</p>`;
  if(!hits.length) return `<p class="note" style="text-align:center">
    Nothing matches “${esc(query)}”.</p>`;
  return `<div style="display:flex;flex-direction:column;gap:1px;background:var(--line-soft);
      border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden">
    ${hits.slice(0, 60).map(w => {
      const en = computeMastery(historyOf(w.mod, w.eng, w.tur, "en_to_tr"));
      const tr = computeMastery(historyOf(w.mod, w.eng, w.tur, "tr_to_en"));
      const col = v => v === 0 ? "var(--faint)" : v >= 0.9 ? "var(--good)" : "var(--ink)";
      return `<div class="hit">
        <span class="w">
          <b>${esc(w.eng)}</b> <span>${esc(w.tur)}</span>
          <span class="mod">${esc(w.mod)}</span>
        </span>
        <span class="dirs">
          <div style="color:${col(en)}">${pct(en)}%<small>EN→TR</small></div>
          <div style="color:${col(tr)}">${pct(tr)}%<small>TR→EN</small></div>
        </span>
      </div>`;
    }).join("")}
  </div>
  ${hits.length > 60 ? `<p class="note" style="text-align:center">
    Showing 60 of ${hits.length} matches.</p>` : ""}`;
}

/* Progress across everything, or narrowed to one module. */
function renderProgress(){
  const all = stats.session_history;
  const mods = [...new Set(all.map(s => s.module))].sort();
  const f = view.filter;
  const hist = f ? all.filter(s => s.module === f) : all;

  let body;
  if(!hist.length){
    body = `<div class="sheet chart"><h3>Nothing recorded yet</h3>
      <p>Finish a round and it shows up here.</p></div>`;
  }else{
    const shown = f ? hist : hist.slice(-40);
    let cc = 0, ct = 0;
    const acc = [], mast = [], dots = [], scores = [];
    const colorOf = m => MODULE_COLORS[mods.indexOf(m) % MODULE_COLORS.length];
    for(const s of shown){
      cc += s.score; ct += s.total;
      acc.push(ct ? cc / ct : 0);
      scores.push(s.total ? s.score / s.total : 0);
      dots.push(colorOf(s.module));
      mast.push(s.mastery === null || s.mastery === undefined ? null : s.mastery);
    }
    const series = f
      ? [{points:acc, color:"var(--cobalt)"}, {points:mast, color:"var(--gold)"}]
      : [{points:scores, color:"var(--line)", dots, noLine:true, markEvery:true},
         {points:acc, color:"var(--cobalt)"}];
    const questions = hist.reduce((n, s) => n + s.total, 0);
    const correct = hist.reduce((n, s) => n + s.score, 0);

    body = `
      <div class="sheet chart">
        <h3>${f ? esc(f) : "Every module"}</h3>
        <p>${f
          ? "Lifetime accuracy against the module's mastery at each round."
          : `Each dot is one round, coloured by module; the line is lifetime accuracy.${
              hist.length > 40 ? ` Showing the last 40 of ${hist.length} rounds.` : ""}`}</p>
        ${lineChart(series, [`${shown.length} rounds ago`, "now"])}
        <div class="legend">
          ${f
            ? `<span><b style="background:var(--cobalt)"></b>Test accuracy</span>
               <span><b style="background:var(--gold)"></b>Mastery</span>`
            : mods.map(m => `<span><b style="background:${colorOf(m)}"></b>${esc(m)}</span>`).join("")}
        </div>
      </div>
      <div class="sheet stack">
        <span class="eyebrow">${f ? esc(f) : "All modules"}</span>
        <p class="note" style="margin:0">
          <b class="num">${hist.length}</b> rounds · <b class="num">${correct}/${questions}</b>
          questions right (<b class="num">${questions ? Math.round(correct / questions * 100) : 0}%</b>) ·
          mastery now <b class="num">${f ? pct(moduleMastery(f, moduleWordsFor(f))) : pct(overallMastery())}%</b>
        </p>
      </div>`;
  }

  app.innerHTML = `
    ${topbar("Progress", "home")}
    <div class="field">
      <select id="filter">
        <option value=""${f ? "" : " selected"}>All modules</option>
        ${mods.map(m => `<option value="${esc(m)}"${f === m ? " selected" : ""}>${esc(m)}</option>`).join("")}
      </select>
    </div>
    ${body}
    ${rankingChart()}`;

  const sel = document.getElementById("filter");
  if(sel) sel.addEventListener("change", e => { view.filter = e.target.value; render(); });
}

function importStats(mode){
  const raw = document.getElementById("paste").value.trim();
  if(!raw) return toast("Nothing to import");
  let incoming;
  try{ incoming = JSON.parse(raw); }
  catch(e){ return toast("That isn't valid JSON"); }
  if(!incoming || typeof incoming !== "object" || !incoming.words)
    return toast("No \"words\" key — is that a stats.json?");
  incoming = normalize(incoming);
  if(mode === "replace"){
    stats = incoming;
  }else{
    // Merge: append unseen history, keep the longer record per word/direction.
    for(const [key, w] of Object.entries(incoming.words)){
      const mine = stats.words[key];
      if(!mine){ stats.words[key] = w; continue; }
      for(const dir of DIRS){
        const a = (mine[dir].history || []), b = (w[dir].history || []);
        if(b.length > a.length){
          mine[dir].history = b;
          mine[dir].seen = Math.max(mine[dir].seen, w[dir].seen);
          mine[dir].correct = Math.max(mine[dir].correct, w[dir].correct);
        }
      }
    }
    for(const [m, d] of Object.entries(incoming.modules)){
      if(!stats.modules[m]) stats.modules[m] = d;
    }
    const seen = new Set(stats.session_history.map(s => s.timestamp));
    for(const s of incoming.session_history){
      if(!seen.has(s.timestamp)) stats.session_history.push(s);
    }
    stats.session_history.sort((a, b) => a.timestamp < b.timestamp ? -1 : 1);
    stats.sessions = stats.session_history.length;
  }
  saveStats();
  toast(mode === "replace" ? "Progress replaced" : "Progress merged");
  render();
}

/* ===========================================================================
   Router + events
   =========================================================================== */
function render(){
  const s = view.screen;
  if(s === "home") renderHome();
  else if(s === "cat") renderCategory();
  else if(s === "setup") renderSetup();
  else if(s === "quiz") renderQuiz();
  else if(s === "results") renderResults();
  else if(s === "progress") renderProgress();
  else if(s === "search") renderSearch();
  else if(s === "data") renderData();
  window.scrollTo(0, 0);
}

function go(screen){ view.screen = screen; render(); }

function pickModule(cat, sub){
  view.mode = "module";
  view.cat = cat;
  view.module = moduleName(cat, sub);
  view.words = wordsOf(cat, sub);
  if(view.count > view.words.length) view.count = view.words.length;
  go("setup");
}

app.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;

  if(act === "home"){ go("home"); }
  else if(act === "tocat"){ go("cat"); }          // back out of setup, keeping view.cat
  else if(act === "cat"){
    const cat = el.dataset.cat;
    if(!cat || !VOCAB[cat]) return;
    if(isFlat(cat)) pickModule(cat, "Main");
    else { view.cat = cat; go("cat"); }
  }
  else if(act === "pick"){ pickModule(view.cat, el.dataset.sub); }
  else if(act === "quick"){
    const low = lowestMasteryModule();
    const cat = Object.keys(VOCAB).find(c =>
      Object.keys(VOCAB[c]).some(s => moduleName(c, s) === low.module));
    const sub = Object.keys(VOCAB[cat]).find(s => moduleName(cat, s) === low.module);
    pickModule(cat, sub);
  }
  else if(act === "dir"){
    const b = ev.target.closest("[data-dir]");
    if(b){ view.dir = b.dataset.dir; render(); }
  }
  else if(act === "count"){
    const b = ev.target.closest("[data-n]");
    if(b){ view.count = +b.dataset.n; prefs.count = view.count; savePrefs(); render(); }
  }
  else if(act === "auto"){
    const b = ev.target.closest("[data-v]");
    if(b){ prefs.autoAdvance = b.dataset.v === "1"; savePrefs(); render(); }
  }
  else if(act === "start"){ startQuiz(); }
  else if(act === "answer"){ answerQuiz(el.dataset.choice); }
  else if(act === "next"){ nextQuestion(); }
  else if(act === "abandon"){ view.quiz = null; go("home"); }
  else if(act === "again"){ view.count = Math.min(view.count, view.words.length); startQuiz(); }
  else if(act === "setup"){ go("setup"); }
  else if(act === "data"){ go("data"); }
  else if(act === "progress"){ go("progress"); }
  else if(act === "search"){ go("search"); }
  else if(act === "checkstart"){
    view.mode = "check";
    view.module = CHECK;
    go("setup");
  }
  else if(act === "threshold"){
    const b = ev.target.closest("[data-t]");
    if(b){ view.threshold = prefs.threshold = +b.dataset.t; savePrefs(); render(); }
  }
  else if(act === "copy"){
    const text = JSON.stringify(stats, null, 2);
    navigator.clipboard.writeText(text)
      .then(() => toast("stats.json copied"))
      .catch(() => { document.getElementById("dump").select(); toast("Press ⌘C / Ctrl+C to copy"); });
  }
  else if(act === "pickfile"){ document.getElementById("file").click(); }
  else if(act === "import"){ importStats("replace"); }
  else if(act === "merge"){ importStats("merge"); }
  else if(act === "reset"){
    if(confirm("Erase all progress on this device? Copy stats.json first if you want a backup.")){
      stats = emptyStats(); view.sitting = []; saveSitting(); saveStats(); go("home");
    }
  }
});

/* Number keys answer, Enter advances -- handy on a laptop, ignored on a phone. */
document.addEventListener("keydown", ev => {
  if(view.screen !== "quiz" || !view.quiz) return;
  const q = view.quiz;
  if(q.picked === null){
    const n = parseInt(ev.key, 10);
    const cur = q.questions[q.i];
    if(n >= 1 && n <= cur.choices.length) answerQuiz(cur.choices[n - 1]);
  }else if(ev.key === "Enter" || ev.key === " "){
    ev.preventDefault(); nextQuestion();
  }
});

render();

/* Offline support, only where it can work: needs a real https origin, so this
   is a no-op opened from file:// and harmless anywhere sw.js isn't served. */
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
